# 서버에서 띄우는 모양. `docker compose up -d` 하나로 DB까지 같이 뜬다.
#
# 개인 PC에서는 이걸 쓸 필요가 없다 — start-all.bat 이 더 간단하고, SQLite 파일 하나로
# 충분하다. 이 파일은 **여러 사람이 쓰는 서버**용이다.
#
# 처음 한 번:
#   cp .env.example .env    (비밀번호를 직접 채운다)
#   docker compose pull     (GitHub이 만들어 올려둔 이미지를 받는다)
#   docker compose up -d
#
# 도메인을 붙여 바깥에 공개할 때는 HTTPS를 끊어주는 웹서버를 같이 띄운다:
#   docker compose --profile https up -d
#
# 이후 업데이트:
#   git pull && docker compose pull && docker compose up -d
#
# 마이그레이션은 앱이 뜨면서 스스로 돌리고, 그 직전에 백업을 한 벌 떠둔다 (app/migrate.py).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      # 기본값을 주지 않는다. 기본 비밀번호는 결국 그대로 서버에 올라간다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 정해주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # 앱이 DB보다 먼저 떠서 "연결 실패"로 죽는 걸 막는다
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # GitHub이 푸시마다 만들어 올려둔 이미지. 서버는 받기만 한다:
    #
    #   docker compose pull && docker compose up -d
    #
    # **작은 서버에서 직접 빌드하지 않기 위한 것이다.** 오라클 무료 티어에서 흔히
    # 잡히는 1GB 인스턴스는 화면 빌드(node) 도중 메모리가 모자라 죽는데, 그게
    # "이유 없이 멈춘 것"처럼 보인다. 이름이 바뀌면 .github/workflows/docker.yml 도
    # 같이 고쳐야 한다 (안 고치면 서버가 조용히 옛 이미지를 계속 받아쓴다 — 그래서
    # 두 파일이 같은 곳을 가리키는지 CI가 대조한다).
    #
    # 태그는 바꿔 끼울 수 있다. 새 이미지에 문제가 있으면 .env 에
    # IMAGE_TAG=sha-1234abc 한 줄로 예전 커밋으로 되돌린다.
    image: ghcr.io/kyos9/dashboard:${IMAGE_TAG:-latest}
    # 받아쓰는 게 기본이지만 빌드도 그대로 된다 — RAM이 넉넉한 서버나 이미지를
    # 손봐야 할 때는 `docker compose up -d --build`.
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://signal:${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 정해주세요}@db:5432/signal
      # 화면을 여는 비밀번호. 여기도 기본값을 주지 않는다 — 공개된 주소에 기본
      # 비밀번호로 올라가는 것이 이 잠금을 만든 이유 자체를 없앤다.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?.env 파일에 DASHBOARD_PASSWORD 를 정해주세요}
      # 매크로 지표용. **비워도 된다** — 키가 없으면 키가 필요 없는 경로로 받는다.
      # 위 둘과 달리 `:?` 를 안 붙인 이유가 그것이다. 없다고 앱이 안 뜨면 안 된다.
      FRED_API_KEY: ${FRED_API_KEY:-}
      # 구글 로그인. 전부 **비워도 된다** — 비우면 위 비밀번호 문 그대로다 (DEPLOY.md 12번).
      # 채우면 비밀번호 문은 닫히고 계정마다 자기 데이터가 보인다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OWNER_GOOGLE_EMAIL: ${OWNER_GOOGLE_EMAIL:-}
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 로그와 백업이 여기 쌓인다. DB는 Postgres에 있으므로 이 볼륨에는 안 들어간다.
      - app-data:/data
    ports:
      # 127.0.0.1 에만 연다. 바깥은 아래 caddy 가 맡는다.
      # 이걸 0.0.0.0 으로 열면 HTTPS를 건너뛰고 평문으로 그대로 노출된다.
      - "127.0.0.1:8000:8000"

  # 바깥에서 들어오는 문. `--profile https` 를 줄 때만 뜬다 — 도메인이 없으면
  # 인증서를 받을 수 없으므로 기본으로 띄우면 계속 실패하며 재시작한다.
  #
  # DOMAIN 은 여기서 필수로 걸지 않는다. 걸면 프로필을 안 쓰는 `docker compose up -d`
  # 까지 같이 멈춘다 (compose 는 안 띄울 서비스의 값도 먼저 다 읽는다). 대신 비워둔
  # 채로 이 프로필을 띄우면 caddy 가 "주소가 없다"며 바로 멈춘다.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: "${DOMAIN:-}"
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 받은 인증서가 여기 남는다. 지우면 처음부터 다시 받는데 발급 횟수 제한이 있다.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. 안 열어도 동작하지만 열어두면 모바일에서 눈에 띄게 빠르다.
      - "443:443/udp"
    depends_on:
      - app

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
