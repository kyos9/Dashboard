# 서버에서 띄우는 모양. `docker compose up -d` 하나로 DB까지 같이 뜬다.
#
# 개인 PC에서는 이걸 쓸 필요가 없다 — start-all.bat 이 더 간단하고, SQLite 파일 하나로
# 충분하다. 이 파일은 **여러 사람이 쓰는 서버**용이다.
#
# 처음 한 번:
#   cp .env.example .env    (비밀번호를 직접 채운다)
#   docker compose up -d
#
# 이후 업데이트:
#   git pull && docker compose up -d --build
#
# 마이그레이션은 앱이 뜨면서 스스로 돌리고, 그 직전에 백업을 한 벌 떠둔다 (app/migrate.py).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      # 기본값을 주지 않는다. 기본 비밀번호는 결국 그대로 서버에 올라간다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 정해주세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # 앱이 DB보다 먼저 떠서 "연결 실패"로 죽는 걸 막는다
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://signal:${POSTGRES_PASSWORD:?.env 파일에 POSTGRES_PASSWORD 를 정해주세요}@db:5432/signal
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 로그와 백업이 여기 쌓인다. DB는 Postgres에 있으므로 이 볼륨에는 안 들어간다.
      - app-data:/data
    ports:
      # 127.0.0.1 에만 연다. 바깥에는 HTTPS를 끊어주는 웹서버를 앞에 두고 붙인다
      # (ROADMAP 5단계). 이걸 0.0.0.0 으로 열면 암호화 없이 그대로 노출된다.
      - "127.0.0.1:8000:8000"

volumes:
  db-data:
  app-data:
