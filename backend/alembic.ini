# Alembic settings for the command line (`alembic revision -m ...`).
#
# KEEP THIS FILE ASCII-ONLY. Alembic reads it with the *system locale* encoding,
# so a single UTF-8 Korean comment raises UnicodeDecodeError on Korean Windows
# (cp949). tests/test_alembic.py enforces this.
#
# The app itself does NOT read this file (it builds the config in code, for the
# same reason). The Korean explanation lives in app/migrate.py.
#
# The database URL is deliberately absent: migrations/env.py takes it from
# app.db so there is only one place to change it.

[alembic]
script_location = migrations
path_separator = os
prepend_sys_path = .
# revision file names: 0002_readable_description.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
