# Alembic 설정.
#
# 접속 주소는 여기 적지 않는다 — migrations/env.py가 app.db에서 가져온다.
# 두 군데에 적어두면 한쪽만 고쳤을 때 엉뚱한 DB를 고치게 된다.

[alembic]
script_location = migrations
path_separator = os
prepend_sys_path = .
# 리비전 파일 이름: 0002_사람이_읽을_수_있는_설명.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
