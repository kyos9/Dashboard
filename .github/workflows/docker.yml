# Docker 이미지를 GitHub이 대신 만들어 올려둔다.
#
# 두 가지를 한다.
#
# 1. **빌드가 되는지 확인한다.** 이 저장소를 만드는 사람의 PC에는 Docker가 없다(회사
#    PC라 설치가 곤란하다). 서버에 올리는 날 처음으로 빌드 오류를 만나는 대신 여기서 본다.
# 2. **만든 이미지를 GHCR에 올려둔다.** 서버가 받아쓰기만 하면 되도록.
#
# 2번이 중요한 이유는 서버가 작기 때문이다. 오라클 무료 티어에서 실제로 잡히는 것은
# 흔히 VM.Standard.E2.1.Micro(RAM 1GB)인데, 거기서 `docker compose build`를 돌리면
# 화면 빌드(node)가 메모리를 넘겨 OOM Killer에게 죽는다 — 그것도 **아무 이유도 말해주지
# 않고 그냥 끝난 것처럼.** 여기(7GB 러너)서 만들어 올려두면 서버는 받기만 하므로 그 문제가
# 통째로 사라지고, 업데이트도 몇 분에서 1분 안쪽으로 줄어든다.
#
# **푸시마다 돈다.** 예전에는 이미지에 영향을 줄 만한 파일이 바뀔 때만 돌렸는데, 그러면
# 앱 소스만 고친 커밋에서 `latest`가 옛 코드에 머문다 — 서버가 받아쓰는 태그가 그것이라
# "올렸는데 그대로"가 된다. 캐시가 있어 안 바뀐 단계는 건너뛴다.

name: Docker 이미지

on:
  push:
  pull_request:
    # 남의 PR은 올리지 않고 빌드만 해본다. 이미지 내용이 바뀔 수 있는 파일일 때만.
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "Caddyfile"
      - "backend/requirements*.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/docker.yml"
  # 필요하면 Actions 탭에서 손으로 돌릴 수 있게
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 소문자로 적는다. 도커 이미지 이름에는 대문자를 쓸 수 없는데 저장소 이름은
  # `Dashboard`라, github.repository 를 그대로 쓰면 거절당한다.
  IMAGE: ghcr.io/kyos9/dashboard

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 이게 있어야 GHCR에 올릴 수 있다. 기본값은 읽기뿐이다.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        # PR에서는 올리지 않으므로 로그인도 하지 않는다 (포크에서 온 PR은 토큰에
        # 쓰기 권한이 없어 이 단계부터 실패한다).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 만든 시각 기록
        id: built
        # 화면 오른쪽 위에 이 시각이 뜬다. UTC 로 넘기고 읽기 좋게 바꾸는 것은
        # 브라우저가 한다 — 보는 사람의 시간대는 서버가 알 수 없다.
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 태그 정하기
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 기본 규칙에 맡기지 않고 둘만 붙인다.
          #
          # - latest      : 기본 브랜치일 때만. **서버가 받아쓰는 태그다.**
          # - sha-xxxxxxx : 항상. 새 이미지에 문제가 있을 때 예전 커밋으로 되돌릴 수 있게.
          #
          # 기본 규칙은 브랜치 이름으로도 태그를 만드는데, 지금 기본 브랜치에는
          # 슬래시가 들어 있어(claude/...) 읽기 어려운 태그가 하나 더 생긴다.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: 이미지 빌드 (+ 올리기)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 화면 오른쪽 위에 이 해시가 뜬다. 서버가 받아쓴 이미지가 어느 커밋인지
          # 눈으로 확인할 수 있어야 "올렸는데 그대로"를 가릴 수 있다.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.built.outputs.at }}
          # 캐시를 남겨두면 다음 빌드에서 안 바뀐 단계는 건너뛴다
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: compose 파일 검사
        # 비밀번호·도메인은 여기서 진짜일 필요가 없다 — 문법과 참조만 본다.
        #
        # 두 번 돌리는 이유: 바깥에 공개할 때는 `--profile https` 로 띄우는데, 그쪽에만
        # 있는 서비스(caddy)는 기본 검사에서 값이 안 읽혀 그냥 지나간다.
        env:
          POSTGRES_PASSWORD: ci-검사용
          DASHBOARD_PASSWORD: ci-검사용
          DOMAIN: signal.example.com
        run: |
          docker compose config --quiet
          docker compose --profile https config --quiet

      - name: compose가 가리키는 이미지가 여기서 올리는 것과 같은지
        # 이 둘이 갈라지면 증상이 고약하다 — 서버는 아무 오류 없이 **옛 이미지**를
        # 계속 받아쓰고, 화면만 그대로다. 사람이 두 파일을 같이 고치기를 바라는 대신
        # 여기서 대조한다.
        env:
          POSTGRES_PASSWORD: ci-검사용
          DASHBOARD_PASSWORD: ci-검사용
        run: |
          compose_image=$(docker compose config --format json | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["services"]["app"]["image"])')
          echo "compose: $compose_image"
          echo "워크플로: ${{ env.IMAGE }}:latest"
          test "$compose_image" = "${{ env.IMAGE }}:latest"

      - name: Caddyfile 검사
        # 문법이 틀리면 **서버에서 처음** 알게 된다 — 그것도 도메인·방화벽을 다 맞춘
        # 다음, 인증서가 안 나오는 모습으로. 여기서 미리 읽혀본다.
        run: |
          docker run --rm -e DOMAIN=signal.example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
