# Docker 이미지가 실제로 빌드되는지 확인한다.
#
# 이 저장소를 만드는 사람의 PC에는 Docker가 없다(회사 PC라 설치가 곤란하다). 그래서
# 서버에 올리는 날 처음으로 빌드 오류를 만나는 대신, GitHub이 대신 빌드해 본다.
#
# 매번 돌리기에는 무거우므로(파이썬 패키지 설치 + 화면 빌드) **이미지 내용이 바뀔 수
# 있는 파일이 건드려졌을 때만** 돈다. 앱 소스만 바뀌는 경우는 tests.yml이 잡는다.
#
# 아래 목록이 두 번 적혀 있는데, GitHub Actions는 YAML 앵커(&, *)를 지원하지 않아서
# 줄이려다 워크플로가 통째로 안 돌게 된다. 한쪽만 고치지 않도록 주의.

name: Docker 이미지

on:
  push:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/requirements*.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/requirements*.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/docker.yml"
  # 필요하면 Actions 탭에서 손으로 돌릴 수 있게
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # 캐시를 남겨두면 다음 빌드에서 안 바뀐 단계는 건너뛴다
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: compose 파일 검사
        # 비밀번호는 여기서 진짜일 필요가 없다 — 문법과 참조만 본다.
        env:
          POSTGRES_PASSWORD: ci-검사용
        run: docker compose config --quiet
