# 푸시할 때마다 GitHub이 자기 서버에서 테스트를 돌린다.
#
# 목적은 "통과했다는 말"을 없애는 것이다. 사람이 돌렸다고 말하는 대신, 커밋 옆에
# ✓ / ✗ 가 붙는다. 실패하면 저장소 주인에게 메일이 간다.
#
# PC에는 아무것도 설치되지 않는다. 전부 GitHub 쪽에서 돈다.

name: 테스트

on:
  push:
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다. 어차피 볼 건 마지막 결과다.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 패키지 설치
        run: pip install -r requirements.txt
        working-directory: backend

      - name: 테스트
        # 네트워크는 conftest가 막아두므로 시세 서버가 막힌 곳에서도 그대로 돈다.
        run: pytest -q
        working-directory: backend

  frontend:
    name: 프런트엔드 (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 패키지 설치
        run: npm ci
        working-directory: frontend

      - name: 빌드
        # 타입 오류를 여기서 잡는다 (build = tsc -b && vite build).
        # 화면은 백엔드가 이 결과물을 내보내므로, 빌드가 깨지면 화면이 통째로 안 뜬다.
        run: npm run build
        working-directory: frontend

      - name: 테스트
        run: npm test
        working-directory: frontend
