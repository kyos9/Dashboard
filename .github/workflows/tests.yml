# 푸시할 때마다 GitHub이 자기 서버에서 테스트를 돌린다.
#
# 목적은 "통과했다는 말"을 없애는 것이다. 사람이 돌렸다고 말하는 대신, 커밋 옆에
# ✓ / ✗ 가 붙는다. 실패하면 저장소 주인에게 메일이 간다.
#
# PC에는 아무것도 설치되지 않는다. 전부 GitHub 쪽에서 돈다.

name: 테스트

on:
  push:
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다. 어차피 볼 건 마지막 결과다.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # 같은 테스트를 두 DB에서 돌린다.
    #
    # 내 PC는 SQLite, 서버는 Postgres다. SQLite는 타입에 느슨하고 외래키를 아예
    # 검사하지 않아서, Postgres가 거절할 것을 조용히 받아준다. 한쪽만 돌리면 그 차이를
    # **서버에서 처음** 알게 된다 — 가장 늦고 가장 나쁜 자리다.
    #
    # 특히 `0001_initial.py`가 Postgres에 실제로 적용되는지, 모델이 Postgres가 보는
    # 스키마와 같은지(드리프트 검사)는 여기서만 확인된다.
    name: 백엔드 (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과는 끝까지 본다 — 어느 DB만의 문제인지가 중요하다.
      fail-fast: false
      matrix:
        db: [SQLite, Postgres]

    # 서비스는 조건부로 띄울 수 없어서 SQLite 쪽에서도 함께 뜬다 (몇 초 더 걸릴 뿐이다).
    # 이미지는 docker-compose.yml과 같은 버전을 쓴다 — 17로 배포할 거면 17에서 검사한다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: signal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 개인 PC·Docker 이미지와 같은 버전으로 맞춘다. 갈라지면 어느 한쪽에서만
          # 터지는 문제를 가장 늦게 알게 된다.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 패키지 설치
        # requirements-postgres.txt도 여기서 같이 설치해 본다 — 서버에서 쓸 파일이
        # 실제로 설치되는지 확인하는 유일한 자리다.
        run: |
          pip install -r requirements.txt
          pip install -r requirements-postgres.txt
        working-directory: backend

      - name: pg_dump 17 (백업 되돌리기 시험)
        # tests/test_backup_restore_pg.py 가 진짜 pg_dump 로 뜨고 되돌린다 (0.46.0 A1). 러너에 깔린 16 은 17 서버를 덤프하지
        # 못하고, 17 을 깔아도 /usr/bin/pg_dump(pg_wrapper)가 16 을 고를 수 있다 — 17 의 bin 을 PATH 앞에 두고 판을 확인한다.
        # 판은 docker-compose.yml 의 postgres:17 · Dockerfile 의 PG_MAJOR 와 같아야 한다(test_backup_restore_versions 가 글자로 본다).
        if: matrix.db == 'Postgres'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: pg_dump 판 확인
        if: matrix.db == 'Postgres'
        run: pg_dump --version | tee /dev/stderr | grep -q "(PostgreSQL) 17\."

      - name: 테스트
        # 네트워크는 conftest가 막아두므로 시세 서버가 막힌 곳에서도 그대로 돈다.
        # TEST_DATABASE_URL이 비어 있으면 메모리 SQLite로 돈다 (tests/dbsetup.py).
        run: pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'Postgres' && 'postgresql+psycopg://postgres:ci@localhost:5432/signal' || '' }}
          # Postgres 갈래에서는 되돌리기 시험을 건너뛰지 못하게 — 도구·판이 없으면 실패한다
          REQUIRE_PG_RESTORE: ${{ matrix.db == 'Postgres' && '1' || '' }}
          # 붓기는 운영처럼 DB 컨테이너 안의 psql 로 (DEPLOY 10-1 은 `docker compose exec db psql`)
          PG_RESTORE_PSQL: ${{ matrix.db == 'Postgres' && format('docker exec -i {0} psql -U postgres', job.services.postgres.id) || '' }}

  frontend:
    name: 프런트엔드 (build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 패키지 설치
        run: npm ci
        working-directory: frontend

      - name: 빌드
        # 타입 오류를 여기서 잡는다 (build = tsc -b && vite build).
        # 화면은 백엔드가 이 결과물을 내보내므로, 빌드가 깨지면 화면이 통째로 안 뜬다.
        run: npm run build
        working-directory: frontend

      - name: 테스트
        run: npm test
        working-directory: frontend
