<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4차 리밸런싱</title>
<!--
  디자인 4차 목업 12 — 묶음 4 "리밸런싱".
  지금(앱, 가짜 서버 15종목): 폰 한 화면 길이 9,482px. 주문 카드 15장(카드마다 비중 줄 · 금액 줄 · 신호 · "거래 입력")
  → 보유 · 목표 비중 고치는 카드 15장(칸 5개씩) → 리뷰 · 기록 → 접힌 설정. PC 는 표 1120px 이 본문보다 넓어 신호 열이 잘림.

  가 · 할 일 줄    한 종목 한 줄(팔기 먼저, 그다음 사기 · 유지는 접음). 줄을 누르면 시트에서 자세히 · 거래 입력.
                   보유 · 목표 고치기 · 기록 · 설정은 아래 줄 셋으로 — 누르면 시트/화면
  나 · 비중 막대    줄마다 지금 비중 막대 + 목표 눈금 + 밴드. "어디가 얼마나 벗어났나"가 먼저, 금액은 오른쪽
  다 · 위 탭 셋     주문 · 비중 · 기록 을 탭으로 나눠 한 번에 하나만. 비중 탭에서 목표를 바로 고침
  공통              줄 누르면 시트(자세히 + 거래 입력) · 목표 비중 한 번에 고치기 시트 · PC 표 6열

  색·글꼴은 앱의 frontend/src/styles/tokens.css 를 그대로 불러 그린다(만드는 법 3). 데이터는 가짜.
  사기 · 팔기는 시그널 색(--signal-buy · --signal-sell)을 쓴다 — 상승 빨강이면 사기도 빨강(묶음 1에서 넘어온 것).
  ?theme=light 로 라이트, ?rise=red 로 상승 빨강.
-->
<link rel="stylesheet" href="../../../../frontend/src/styles/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#6b7280}
body{font-family:var(--font-sans);word-break:keep-all;padding:24px;display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1700px;margin:0 auto;color:var(--text)}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font-weight:600;font-size:15px;color:#fff;text-align:center;line-height:1.35;max-width:390px}
.cap small{display:block;font-weight:400;font-size:12px;opacity:.88;margin-top:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.phone{width:390px;height:844px;position:relative;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);background:var(--bg);display:flex;flex-direction:column}
.phone.tall{height:auto;min-height:844px;padding-bottom:84px}
.phone .scroll{flex:1;overflow:hidden;padding-bottom:84px}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;background:var(--brand);color:var(--on-brand)}
.top{background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:4px;padding:2px 8px 8px 16px;flex:none}
.top b{font-size:17px;font-weight:700;flex:1}
.top .fresh{font-size:12px;color:var(--on-brand-dim);margin-right:4px}
.ic{width:44px;height:44px;display:grid;place-items:center;flex:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}
.h1{display:flex;align-items:center;gap:8px;padding:14px 8px 4px 16px}
.h1 b{font-size:var(--fs-title);font-weight:700;flex:1}
.pill{font-size:var(--fs-caption);font-weight:600;color:var(--text-dim);background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:5px 10px;white-space:nowrap}
.pill em{font-style:normal;color:var(--accent)}
.more-btn{width:44px;height:44px;display:grid;place-items:center;color:var(--text-dim)}
.shape{display:inline-block;width:.68em;height:.68em;margin-right:3px;vertical-align:0;background:currentColor}
.tri-up{clip-path:polygon(50% 0,100% 100%,0 100%)}.tri-dn{clip-path:polygon(0 0,100% 0,50% 100%)}.dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.badge{display:inline-flex;align-items:center;font-size:var(--fs-caption);font-weight:600;white-space:nowrap;border-radius:6px;padding:2px 6px;vertical-align:1px}
.b-buy{color:var(--signal-buy);background:var(--signal-buy-soft)}
.b-sell{color:var(--signal-sell);background:var(--signal-sell-soft)}
.b-wt{color:var(--signal-weight);background:var(--signal-weight-soft)}
.b-plain{color:var(--text-faint);background:var(--slate-soft)}
.buy{color:var(--signal-buy)} .sell{color:var(--signal-sell)} .faint{color:var(--text-faint)}
/* 요약 */
.sum{margin:8px 16px 0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.sum .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum .l1 span{font-size:var(--fs-caption);color:var(--text-faint)}
.sum .l1 b{font-size:20px;font-weight:700}
.sum .l2{display:flex;gap:14px;margin-top:4px;font-size:var(--fs-caption);color:var(--text-dim)}
.sum .l2 b{font-weight:600;color:var(--text)}
.warn{margin:8px 16px 0;display:flex;align-items:center;gap:8px;background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:var(--radius);padding:10px 12px;font-size:var(--fs-sub);color:var(--amber)}
.warn .go{margin-left:auto;font-weight:600;white-space:nowrap}
.money{margin:8px 16px 0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.money .r{display:flex;align-items:center;gap:8px;font-size:var(--fs-sub)}
.money .r .lab{flex:1;color:var(--text-dim)}
.inp{height:44px;min-width:140px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 12px;font-size:var(--fs-strong);background:var(--panel)}
.inp.ph{color:var(--text-faint);font-size:var(--fs-body)}
.inp u{text-decoration:none;font-size:var(--fs-sub);color:var(--text-faint)}
.chk{display:flex;align-items:center;gap:8px;font-size:var(--fs-caption);color:var(--text-dim);margin-top:8px}
.chk i{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;display:inline-block}
.chips{display:flex;gap:6px;padding:12px 16px 6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:var(--fs-sub);color:var(--text-dim);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.chips .sp{flex:1}
.chips small{font-size:var(--fs-caption);color:var(--text-faint)}
.sec{font-size:var(--fs-caption);font-weight:600;color:var(--text-faint);padding:14px 16px 6px;display:flex;justify-content:space-between;gap:8px}
.sec em{font-style:normal;font-weight:400}
/* 가 · 할 일 줄 */
.list{background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.ord{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border);min-height:62px}
.ord:last-child{border-bottom:0}
.ord .nm{flex:1;min-width:0}
.ord .nm b{display:block;font-size:var(--fs-body);font-weight:600;text-wrap:balance}
.ord .nm small{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--fs-caption);color:var(--text-faint);margin-top:3px}
.ord .act{text-align:right;flex:none}
.ord .act b{display:block;font-size:var(--fs-body);font-weight:700}
.ord .act small{display:block;font-size:var(--fs-caption);color:var(--text-dim);margin-top:2px}
.ord .go{color:var(--text-faint);font-size:18px;width:10px;flex:none}
.fold{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:var(--fs-sub);color:var(--text-dim);background:var(--panel);border-bottom:1px solid var(--border)}
.fold .go{margin-left:auto;color:var(--text-faint)}
.links{margin:14px 16px 0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.lk{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:var(--fs-body);min-height:56px}
.lk:last-child{border-bottom:0}
.lk .lead{color:var(--accent)}
.lk small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.lk .go{margin-left:auto;color:var(--text-faint)}
/* 나 · 비중 막대 */
.wb{padding:10px 12px 10px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.wb:last-child{border-bottom:0}
.wb .nm{flex:1;min-width:0}
.wb .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wb .t b{font-size:var(--fs-body);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb .t span{font-size:var(--fs-caption);font-weight:700;white-space:nowrap}
.track{position:relative;height:10px;border-radius:5px;background:var(--panel-soft);margin:7px 0 4px;border:1px solid var(--border)}
.track .band{position:absolute;top:-1px;bottom:-1px;background:var(--signal-weight-soft)}
.track .fill{position:absolute;left:0;top:1px;bottom:1px;border-radius:4px;background:var(--text-faint)}
.track .fill.over{background:var(--signal-sell)} .track .fill.under{background:var(--signal-buy)} .track .fill.ok{background:var(--signal-weight)}
.track .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
.wb .m{display:flex;justify-content:space-between;font-size:var(--fs-caption);color:var(--text-faint)}
.wb .go{color:var(--text-faint);font-size:18px;width:10px;flex:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 16px 8px;font-size:var(--fs-caption);color:var(--text-faint)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* 다 · 위 탭 */
.utabs{display:flex;background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.utabs span{flex:1;text-align:center;font-size:var(--fs-body);font-weight:600;padding:12px 0 11px;color:var(--text-faint);border-bottom:2px solid transparent}
.utabs .on{color:var(--accent);border-color:var(--accent)}
.ed{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--border);min-height:60px}
.ed:last-child{border-bottom:0}
.ed .nm{flex:1;min-width:0}
.ed .nm b{display:block;font-size:var(--fs-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed .nm small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.ed .inp{min-width:0;width:86px;height:40px;font-size:var(--fs-body)}
.ed .inp.dirty{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.savebar{position:absolute;left:12px;right:12px;bottom:92px;display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);box-shadow:var(--shadow-pop);border-radius:var(--radius);padding:8px 8px 8px 14px;font-size:var(--fs-sub)}
.savebar span{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--panel);font-weight:600;font-size:var(--fs-sub);color:var(--text)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
:root[data-theme='light'] .btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.rec{margin:8px 16px 0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.rec h4{font-size:var(--fs-body);font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.rec h4 small{font-weight:400;color:var(--text-faint);font-size:var(--fs-caption)}
.rec .dday{font-size:26px;font-weight:700;margin:4px 0 2px}
.rec p{font-size:var(--fs-caption);color:var(--text-faint);line-height:1.5}
.rec .r{display:flex;gap:8px;margin-top:10px}
.rec .r .inp{flex:1;justify-content:flex-start;font-size:var(--fs-sub);color:var(--text-faint)}
.snap{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);font-size:var(--fs-sub)}
.snap:first-of-type{margin-top:8px}
.snap small{color:var(--text-faint);font-size:var(--fs-caption)}
/* 시트 */
.dim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-elevated);border-radius:16px 16px 0 0;padding:8px 16px 30px;box-shadow:var(--shadow-up)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 12px}
.sheet h3{font-size:var(--fs-strong);font-weight:700;display:flex;align-items:center;gap:8px}
.sheet .sub{font-size:var(--fs-caption);color:var(--text-faint);margin:2px 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:var(--fs-sub);margin:4px 0 12px}
.kv dt{color:var(--text-faint)} .kv dd{text-align:right;font-weight:600}
.kv dd small{display:block;font-weight:400;color:var(--text-faint);font-size:var(--fs-caption)}
.big-act{display:flex;align-items:baseline;justify-content:space-between;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.big-act b{font-size:22px;font-weight:700}
.big-act span{font-size:var(--fs-sub);color:var(--text-dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary{display:flex;align-items:center;justify-content:center;height:50px;border-radius:var(--radius);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:var(--fs-strong)}
:root[data-theme='light'] .primary{background:var(--brand);color:var(--on-brand)}
.hint{font-size:var(--fs-caption);color:var(--text-faint);line-height:1.5;margin-top:10px;text-wrap:pretty}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;padding:8px 6px 26px;background:var(--panel);border-top:1px solid var(--border);color:var(--text-faint)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-caption)}
.tabbar .on{color:var(--accent);font-weight:600}
.tabbar .on svg path.f{fill:currentColor}
.hgt{font-size:11px;font-weight:600;color:var(--on-amber);background:var(--amber);border-radius:4px;padding:1px 6px;margin-left:6px}
/* PC */
.pc{width:1280px;background:var(--bg);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;min-height:760px}
.pc nav{width:232px;background:var(--panel);border-right:1px solid var(--border);padding:20px 12px;flex:none}
.pc nav .logo{font-weight:700;font-size:17px;padding:0 10px 18px}
.pc nav a{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:var(--radius-sm);font-size:var(--fs-body);color:var(--text-dim);margin-bottom:2px}
.pc nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pc main{flex:1;padding:24px 28px;min-width:0}
.pc .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pc .hd b{font-size:22px;font-weight:700;flex:1}
.pc .row3{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;margin-bottom:14px}
.pc .box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.pc .box .l1{display:flex;gap:28px;align-items:baseline}
.pc .box .l1 div span{display:block;font-size:var(--fs-caption);color:var(--text-faint)}
.pc .box .l1 div b{font-size:var(--fs-strong);font-weight:700}
.pc .box .l1 div b.big{font-size:26px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:var(--fs-sub)}
th{font-size:var(--fs-caption);color:var(--text-faint);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel-soft);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
td.r,th.r{text-align:right}
td small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
td .track{margin:4px 0 2px;width:180px}
tr.grp td{background:var(--panel-soft);font-size:var(--fs-caption);font-weight:600;color:var(--text-faint);padding:6px 12px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--text-faint);background:var(--slate-soft);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.trade{color:var(--accent);font-weight:600;font-size:var(--fs-caption);white-space:nowrap}
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search)
if (q.get('theme') === 'light') document.documentElement.dataset.theme = 'light'
if (q.get('rise') === 'red') document.documentElement.dataset.rise = 'red'

/* 앱 아이콘(iconPaths.ts)에서 가져온 그림 */
const P = {
  home: [['M3.8 11.2 10.7 5a2 2 0 0 1 2.6 0l6.9 6.2V19a1.5 1.5 0 0 1-1.5 1.5H5.3A1.5 1.5 0 0 1 3.8 19z', 1], ['M12 14.5v3']],
  stocks: [['M7 3.5v3M7 15.5v4M17 4.5v4M17 15.5v4'], ['M5 6.5h4v9H5z', 1], ['M15 8.5h4v7h-4z', 1]],
  rebalance: [['M20.5 12A8.5 8.5 0 1 1 12 3.5M17 12a5 5 0 1 1-5-5'], ['M12 3.5A8.5 8.5 0 0 1 20.5 12H17a5 5 0 0 0-5-5z', 1]],
  macro: [['M3.5 16.5a8.5 8.5 0 1 1 17 0z', 1], ['M12 16.5l3.5-5'], ['M3.5 16.5h17']],
  settings: [['M18.66 9.84L20.55 10.37Q21.60 12.00 20.55 13.63L18.66 14.16L17.20 16.68L17.68 18.59Q16.80 20.31 14.86 20.22L13.46 18.85L10.54 18.85L9.14 20.22Q7.20 20.31 6.32 18.59L6.80 16.68L5.34 14.16L3.45 13.63Q2.40 12.00 3.45 10.37L5.34 9.84L6.80 7.32L6.32 5.41Q7.20 3.69 9.14 3.78L10.54 5.15L13.46 5.15L14.86 3.78Q16.80 3.69 17.68 5.41L17.20 7.32Z'], ['M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z']],
  more: [['M4.5 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M11 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M17.5 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0']],
  edit: [['M4 20h4L19 9l-4-4L4 16z'], ['M13.5 6.5l4 4']],
  doc: [['M5.5 3.5h13v17h-13z'], ['M9 8.5h6M9 12h6M9 15.5h3.5']],
  refresh: [['M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4']],
  chev: [['M6 9l6 6 6-6']],
}
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${P[n].map(([d, f]) => `<path d="${d}"${f ? ' class="f"' : ''}/>`).join('')}</svg>`
const status = () => `<div class="status"><span class="num">8:12</span><span>●●● ▮</span></div>`
const topBar = () => `<div class="top"><b>자산관리</b><span class="fresh">방금 받음</span><span class="ic">${ic('refresh')}</span></div>`
const TABS = [['home', '홈'], ['stocks', '종목'], ['rebalance', '리밸런싱'], ['macro', '매크로'], ['settings', '설정']]
const tabbar = (on = 2) => `<nav class="tabbar">${TABS.map(([k, n], i) => `<a class="${i === on ? 'on' : ''}">${ic(k)}${n}</a>`).join('')}</nav>`
const sh = { buy: '<i class="shape tri-up"></i>', sell: '<i class="shape tri-dn"></i>', wt: '<i class="shape dia"></i>' }
const sig = (k) => k === 'over' ? `<span class="badge b-wt">${sh.wt}비중 초과</span>` : k === 'under' ? `<span class="badge b-wt">${sh.wt}비중 미달</span>` : k === 'ref' ? `<span class="badge b-plain">${sh.sell}기간 내 매도</span>` : ''
const won = (v) => (v < 0 ? '−' : '+') + '₩' + Math.abs(v).toLocaleString('en-US')
const short = (v) => { const a = Math.abs(v); return (v < 0 ? '−' : '+') + (a >= 1e8 ? (a / 1e8).toFixed(2) + '억' : Math.round(a / 1e4).toLocaleString('en-US') + '만') }

/* 가짜 주문 — 이름, 구분, 지금 %, 목표 %, 조정 금액(원), 주수, 신호들, 현지 금액 */

  ['삼성전자우', '배당', 12.6, 4, -43811225, -409, ['over', 'ref']],

  ['NVDA', '알파', 8.9, 6, -14790400, -14, [], '−$10,677'],

  ['GOOG', '알파', 0.8, 4, 16359769, 80, ['ref'], '+$11,810'],
  ['トヨタ自動車', '배당', 2.2, 4, 9020149, 237, ['ref'], '+¥968,867'],
  ['KODEX 200', '지수', 5.8, 6, 0, 0, []],
  ['SK하이닉스', '알파', 3.8, 4, 0, 0, []],
  ['東京海上ホールディングス', '배당', 1.9, 2, 0, 0, []],
]
const sells = O.filter((o) => o[4] < 0), buys = O.filter((o) => o[4] > 0), holds = O.filter((o) => o[4] === 0)
const act = (o) => o[4] < 0 ? `<b class="sell num">팔기 ${Math.abs(o[5]).toLocaleString('en-US')}주</b>` : o[4] > 0 ? `<b class="buy num">사기 ${o[5].toLocaleString('en-US')}주</b>` : `<b class="faint">유지</b>`

const col = (cap, sub, body) => `<div class="col"><div class="cap">${cap}<small>${sub}</small></div>${body}</div>`
const phone = (inner, cls = '') => `<div class="phone ${cls}">${inner}</div>`
const head = () => `<div class="h1"><b>리밸런싱</b><span class="pill">다음 리뷰 <em class="num">D-48</em></span><span class="more-btn">${ic('more')}</span></div>`
const sum = () => `<div class="sum"><div class="l1"><span>전체 자금 · 현금 포함</span><b class="num">₩510,529,378</b></div>
  <div class="l2"><span>현금 <b class="num">₩0</b></span><span>목표 현금 <b class="num">0%</b></span><span>밴드 <b class="num">±3%p</b></span></div></div>`
const warn = () => `<div class="warn">⚠ 목표 합계 <b class="num">90%</b> — 100%가 아님<span class="go">고치기 ›</span></div>`

/* ---------- 가 · 할 일 줄 ---------- */
const ordRow = (o) => `<div class="ord"><div class="nm"><b>${o[0]}</b><small><span class="num">${o[2].toFixed(1)}% → 목표 ${o[3]}%</span>${o[6].map(sig).join('')}</small></div>
  <div class="act">${act(o)}<small class="num">${o[4] ? won(o[4]) : '—'}</small></div><span class="go">›</span></div>`
const gaBody = (all) => `${head()}${sum()}${warn()}${money()}
  <div class="chips"><span class="chip on">할 일 ${sells.length + buys.length}</span><span class="chip">비중 신호 3</span><span class="sp"></span><small>팔기 먼저</small></div>

  ${all ? `<div class="sec"><span>유지 ${holds.length}</span><em>조정이 전체의 0.5% 미만</em></div>

  <div class="links">

const MAX = 36

  <div class="track"><i class="band" style="left:${lo / MAX * 100}%;width:${(hi - lo) / MAX * 100}%"></i><i class="fill ${cls}" style="width:${Math.min(o[2], MAX) / MAX * 100}%"></i><i class="tgt" style="left:${o[3] / MAX * 100}%"></i></div>
  <div class="m"><span class="num">${o[2].toFixed(1)}% · 목표 ${o[3]}% (${d > 0 ? '+' : ''}${d.toFixed(1)}%p)</span><span class="num">${o[4] ? short(o[4]) : ''}</span></div></div><span class="go">›</span></div>`
}
const byDrift = [...O].sort((a, b) => Math.abs(b[2] - b[3]) - Math.abs(a[2] - a[3]))
out.push(col('나 · 비중 막대', '지금 비중 막대 · 목표 눈금 · 밴드(옅은 칸). 많이 벗어난 순. "어디가 얼마나"가 먼저, 주문은 오른쪽 위', phone(`${status()}${topBar()}<div class="scroll">${head()}${sum()}${warn()}
  <div class="legend"><span><i style="background:var(--signal-sell)"></i>목표보다 많음</span><span><i style="background:var(--signal-buy)"></i>적음</span><span><i style="background:var(--signal-weight-soft);border:1px solid var(--border)"></i>밴드 ±3%p</span><span>│ 목표</span></div>
  <div class="list">${byDrift.slice(0, 9).map(wbRow).join('')}</div></div>${tabbar()}`)))

/* ---------- 다 · 위 탭 셋 ---------- */
const utabs = (on) => `<div class="utabs">${['주문', '비중', '기록'].map((t, i) => `<span class="${i === on ? 'on' : ''}">${t}</span>`).join('')}</div>`
out.push(col('다 · 위 탭 셋 — 주문', '주문 · 비중 · 기록 을 탭으로. 주문 탭은 가 와 같은 줄', phone(`${status()}${topBar()}${head()}${utabs(0)}<div class="scroll">${sum()}${money()}
  <div class="sec"><span>팔기 ${sells.length}</span><em class="num">${short(sells.reduce((s, o) => s + o[4], 0))}</em></div>
  <div class="list">${sells.slice(0, 4).map(ordRow).join('')}</div></div>${tabbar()}`)))
const edRow = (o, v, dirty) => `<div class="ed"><div class="nm"><b>${o[0]}</b><small class="num">지금 ${o[2].toFixed(1)}%</small></div><span class="inp num${dirty ? ' dirty' : ''}">${v} <u>%</u></span></div>`
out.push(col('다 · 위 탭 셋 — 비중', '목표 비중을 줄에서 바로 고침 · 합계가 위에 · 바뀌면 아래 저장 줄. 수량 · 평단가는 종목 안 "보유"', phone(`${status()}${topBar()}${head()}${utabs(1)}<div class="scroll">
  <div class="warn">목표 합계 <b class="num">92%</b> (현금 0% 포함) — 8%p 남음</div>
  <div class="sec"><span>종목 15 · 현금</span><em>밴드는 ⋯ 설정</em></div>

  <div class="savebar"><span>바뀐 1줄 (TIGER 미국…)</span><span class="btn">되돌리기</span><span class="btn pri">저장</span></div>${tabbar()}`)))
out.push(col('다 · 위 탭 셋 — 기록', '다음 리뷰 · 지금 상태 기록하기 · 지난 기록', phone(`${status()}${topBar()}${head()}${utabs(2)}<div class="scroll">
  <div class="rec"><h4>다음 리뷰<small>분기 마지막 거래일</small></h4><div class="dday num">D-48 <small style="font-size:14px;color:var(--text-faint);font-weight:400">2026-12-30</small></div>
    <div class="r"><span class="inp">메모 (선택)</span><span class="btn pri" style="height:44px">지금 상태 기록</span></div></div>
  <div class="rec"><h4>지난 기록<small>3건</small></h4>
    <div class="snap"><span>2026-09-30 <small>분기 리뷰</small></span><span class="num">₩482,110,045 ›</span></div>
    <div class="snap"><span>2026-06-30</span><span class="num">₩455,901,330 ›</span></div>
    <div class="snap"><span>2026-03-31</span><span class="num">₩431,288,900 ›</span></div></div>
  <p class="hint" style="margin:10px 16px 0">기록은 남긴 모습 그대로입니다. 종목을 지우거나 목표를 바꿔도 달라지지 않습니다.</p></div>${tabbar()}`)))

/* ---------- 공통 · 시트 ---------- */
out.push(col('공통 · 줄을 누르면', '한 종목 자세히 + 거래 입력. 지금 카드에 있던 것(금액 · 현지 금액 · 신호 뜻)을 여기로', phone(`${status()}${topBar()}<div class="scroll">${gaBody(false)}</div>${tabbar()}<div class="dim"></div>
  <div class="sheet"><div class="grab"></div><h3>AAPL ${sig('over')}</h3><div class="sub">알파 · 30주 · $1,415.49</div>
  <div class="big-act"><b class="sell num">팔기 16주</b><span class="num">−₩33,295,634<br><small class="faint">주문 −$24,036.70</small></span></div>
  <dl class="kv"><dt>비중</dt><dd class="num">11.5% → 목표 5%<small>밴드 ±3%p 밖 — 리뷰 때 맞출 종목</small></dd>
  <dt>평가금액</dt><dd class="num">₩58,822,102<small>목표 ₩25,526,469</small></dd>
  <dt>참고</dt><dd>${sig('ref')}<small>이번 리뷰 기간에 매도 시그널이 뜬 적 있음 · 주문 수에는 영향 없음</small></dd></dl>
  <div class="two"><span class="btn" style="height:50px">종목 안 보기</span><span class="primary">거래 입력</span></div></div>`)))
const bulk = (o, i) => `<div class="ed" style="padding:6px 0;min-height:52px"><div class="nm"><b>${o[0]}</b><small class="num">${[30, 25, 120, 40, 2000, 409][i] ?? 10}주 · 지금 ${o[2].toFixed(1)}%</small></div><span class="inp num" style="width:72px">${o[3]} <u>%</u></span><span class="inp ph" style="width:72px;font-size:13px">기본 <u>%p</u></span></div>`
out.push(col('공통 · 보유 · 목표 고치기', '지금 15장 카드(칸 5개씩) → 한 시트에 목표 · 밴드만 줄로. 수량 · 평단가 · 산 환율은 종목 안 "보유"(묶음 3)와 같은 칸', phone(`${status()}${topBar()}<div class="scroll">${gaBody(false)}</div><div class="dim"></div>
  <div class="sheet" style="top:120px"><div class="grab"></div><h3>목표 비중 · 밴드</h3><div class="sub">합계 <b class="num" style="color:var(--amber)">90%</b> · 현금 목표 0% 포함 — 100%가 되게</div>
  <div style="display:flex;font-size:11px;color:var(--text-faint);gap:10px;padding:0 0 4px"><span style="flex:1">종목</span><span style="width:72px;text-align:center">목표</span><span style="width:72px;text-align:center">밴드</span></div>
  ${O.slice(0, 8).map(bulk).join('')}
  <div class="two" style="margin-top:12px"><span class="btn" style="height:50px">닫기</span><span class="primary">저장</span></div></div>`)))

/* ---------- PC ---------- */
const pcRow = (o) => {
  const d = o[2] - o[3], cls = Math.abs(d) <= 3 ? 'ok' : d > 0 ? 'over' : 'under', lo = Math.max(0, o[3] - 3), hi = o[3] + 3
  return `<tr><td><span class="tag">${o[1]}</span><b>${o[0]}</b></td>
  <td><div class="track"><i class="band" style="left:${lo / MAX * 100}%;width:${(hi - lo) / MAX * 100}%"></i><i class="fill ${cls}" style="width:${Math.min(o[2], MAX) / MAX * 100}%"></i><i class="tgt" style="left:${o[3] / MAX * 100}%"></i></div><small class="num">${o[2].toFixed(1)}% → ${o[3]}% (${d > 0 ? '+' : ''}${d.toFixed(1)}%p)</small></td>
  <td>${act(o)}</td><td class="r num">${o[4] ? won(o[4]) : '—'}<small>${o[7] ? '주문 ' + o[7] : ''}</small></td>

}
out.push(col('PC — 표 6열 (가 · 나 · 다 공통)', '지금 10열 1120px(신호 열 잘림) → 종목 · 비중 막대 · 주문 · 금액 · 신호 · 거래. 팔기 / 사기 / 유지로 묶음. 보유 고치기 · 기록 · 설정은 오른쪽 위', `<div class="pc"><nav><div class="logo">자산관리</div>${TABS.map(([k, n], i) => `<a class="${i === 2 ? 'on' : ''}">${ic(k)}${n}</a>`).join('')}</nav>
  <main><div class="hd"><b>리밸런싱</b><span class="pill">다음 리뷰 <em class="num">D-48</em></span><span class="btn">${ic('edit', 'i s')}&nbsp;보유 · 목표 고치기</span><span class="btn">기록</span><span class="btn">설정</span></div>
  <div class="row3"><div class="box"><div class="l1"><div><span>전체 자금 · 현금 포함</span><b class="big num">₩510,529,378</b></div><div><span>현금</span><b class="num">₩0</b></div><div><span>목표 합계</span><b class="num" style="color:var(--amber)">90% ⚠</b></div></div></div>
  <div class="box"><div style="display:flex;align-items:center;gap:10px;font-size:var(--fs-sub)"><span style="flex:1;color:var(--text-dim)">새로 넣을 돈 (선택)</span><span class="inp ph">0 <u>원</u></span></div><div class="chk"><i></i>팔지 않고 새 돈만 나누기</div></div></div>
  <table><thead><tr><th>종목</th><th>비중 · 지금 → 목표</th><th>주문</th><th class="r">조정 금액</th><th>신호</th><th></th></tr></thead><tbody>
  <tr class="grp"><td colspan="6">팔기 ${sells.length} · ${short(sells.reduce((s, o) => s + o[4], 0))}</td></tr>${sells.map(pcRow).join('')}
  <tr class="grp"><td colspan="6">사기 ${buys.length} · ${short(buys.reduce((s, o) => s + o[4], 0))}</td></tr>${buys.slice(0, 3).map(pcRow).join('')}
  <tr class="grp"><td colspan="6">… 사기 ${buys.length - 3} 더 · 유지 ${holds.length}</td></tr></tbody></table></main></div>`))

document.body.innerHTML = out.join('')
</script>
