<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4차 색 조합</title>
<!--
  디자인 4차 목업 16 — 주인이 보낸 색표 넷을 홈 화면에 입혀 본 것. 주인: "이 색 조합으로 한 번 목업 만들어줘".
  가 네이비·베이지 #213448 #547792 #94b4c1 #eae0cf
  나 세이지       #f6f0d7 #c5d89d #9cab84 #89986d
  다 블루         #f9f7f7 #dbe2ef #3f72af #112d4e
  라 로즈         #fcf8f8 #fbefef #f9dfdf #f5afaf
  색표 그대로 글자에 쓰면 대비가 모자라는 곳(나 · 라 의 글자 · 링크)은 같은 색 계열에서 진하게 뽑은 "먹"을 따로 둔다 — 아래 견본 줄에 "글자용" 으로 표시.
  매수 초록 · 매도 빨강은 그대로, 비중 신호는 각 조합의 강조색. 라이트만. 데이터는 가짜.
  tokens.css 를 부르지 않고 이 파일 안에서 칸 변수를 조합마다 덮어쓴다 — 고르면 tokens.css 로 옮긴다.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#5f646b}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;word-break:keep-all;padding:24px 16px;max-width:1760px;margin:0 auto;color:#fff}
h1{font-size:20px;font-weight:700}
h1 small{display:block;font-size:13px;font-weight:400;opacity:.9;margin-top:4px;line-height:1.5}
.grid{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font-weight:600;font-size:15px;text-align:center}
.pal{display:flex;gap:4px;min-height:52px;align-items:flex-start}
.pal i{display:flex;flex-direction:column;align-items:center;gap:3px;font-style:normal;font-size:10.5px;opacity:.95}
.pal i::before{content:'';width:46px;height:26px;border-radius:6px;background:var(--c);border:1px solid rgba(255,255,255,.35)}
.pal i.ink::before{border:2px dashed rgba(255,255,255,.7)}
.num{font-variant-numeric:tabular-nums}

/* 칸 변수 기본(앱 라이트) — .phone 에서 조합마다 덮어씀 */
.phone{
  --text:#0e1b2e;--text-dim:#334459;--text-faint:#5a6a7f;
  --buy:#18694a;--buy-soft:rgba(24,105,74,.1);--sell:#b02a2a;--sell-soft:rgba(176,42,42,.09);
  --up:#b02a2a;--down:#1f50c2;
  width:360px;height:780px;position:relative;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);
  background:var(--bg);display:flex;flex-direction:column;color:var(--text);font-size:14px}
.status{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;background:var(--brand);color:var(--on-brand)}
.top{background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:4px;padding:2px 8px 10px 16px;flex:none}
.top b{font-size:17px;font-weight:700;flex:1}
.top .fresh{font-size:12px;color:var(--on-brand-dim);margin-right:4px}
.ic{width:40px;height:40px;display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.scroll{flex:1;overflow:hidden;padding-bottom:80px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px}
.sum{margin:12px 14px 0;padding:14px 16px}
.sum .t{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--text-dim)}
.sum .t a{color:var(--accent-ink);font-weight:600}
.sum .big{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:6px 0 10px}
.sum .g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.sum .g span{display:block;font-size:12px;color:var(--text-faint)}
.sum .g b{font-size:16px;font-weight:700}
.alloc{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:14px;gap:2px}
.alloc i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--text-faint)}
.leg span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:4px;vertical-align:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);margin:8px 14px 0}
.tiles>div{text-align:center;padding:10px 4px}
.tiles>div+div{border-left:1px solid var(--border)}
.tiles b{display:block;font-size:22px;font-weight:700}
.tiles span{font-size:12px;font-weight:600}
.airow{display:flex;align-items:center;gap:10px;margin:8px 14px 0;padding:11px 14px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px}
.airow b{display:block;font-size:14px;color:var(--accent-ink)}
.airow small{display:block;font-size:12px;color:var(--text-dim);margin-top:2px}
.airow .go{margin-left:auto;color:var(--accent-ink)}
.sech{display:flex;align-items:baseline;gap:6px;padding:16px 16px 8px;font-size:16px;font-weight:700}
.sech small{font-size:12px;color:var(--text-faint);font-weight:600}
.sech .seg{margin-left:auto;display:inline-flex;background:var(--panel-soft);border:1px solid var(--border);border-radius:8px;padding:2px}
.sech .seg span{font-size:12px;padding:4px 9px;border-radius:6px;color:var(--text-dim);font-weight:600}
.sech .seg span.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border-strong)}
.list{background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.lh{display:flex;justify-content:space-between;padding:7px 16px;font-size:12px;color:var(--text-faint);background:var(--panel-soft);border-bottom:1px solid var(--border)}
.row{display:flex;gap:10px;padding:10px 16px;align-items:flex-start}
.row+.row{border-top:1px solid var(--border)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600}
.row .nm small{display:block;font-size:12px;color:var(--text-faint);margin-top:2px}
.row .nm .badge{margin-top:5px}
.row .v{text-align:right}
.row .v b{display:block;font-weight:700}
.row .v small{display:block;font-size:12px;margin-top:2px}
.wbar{height:4px;background:var(--panel-soft);border-radius:2px;margin-top:6px;width:120px;position:relative}
.wbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--bar)}
.wbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-dim)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px}
.b-buy{color:var(--buy);background:var(--buy-soft)}
.b-sell{color:var(--sell);background:var(--sell-soft)}
.b-wt{color:var(--accent-ink);background:var(--accent-soft)}
.shape{display:inline-block;width:.68em;height:.68em;margin-right:3px;background:currentColor}
.tri-up{clip-path:polygon(50% 0,100% 100%,0 100%)}.tri-dn{clip-path:polygon(0 0,100% 0,50% 100%)}.dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.up{color:var(--up)}.down{color:var(--down)}.faint{color:var(--text-faint)}
.btn{display:flex;margin:12px 14px 0;height:44px;align-items:center;justify-content:center;border-radius:8px;background:var(--btn);color:var(--on-btn);font-weight:700}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;display:flex;padding:8px 6px 22px;background:var(--panel);border-top:1px solid var(--border);color:var(--text-faint)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
.tabbar .on{color:var(--accent-ink);font-weight:600}
.tabbar .on path.f{fill:currentColor}

/* ── 가 네이비·베이지 ── */
.p1{--bg:#f3ede2;--panel:#fffdf9;--panel-soft:#f5efe4;--border:#e4dac8;--border-strong:#cfc2ab;
  --text:#18273a;--text-dim:#33475d;--text-faint:#5e6c7a;
  --brand:#213448;--on-brand:#fff;--on-brand-dim:#c4d5dc;
  --accent-ink:#40637d;--accent-soft:rgba(148,180,193,.22);--accent-line:rgba(84,119,146,.35);
  --btn:#213448;--on-btn:#fff;--bar:#547792;
  --a1:#213448;--a2:#547792;--a3:#94b4c1;--a4:#d6c7ab}
/* ── 나 세이지 ── */
.p2{--bg:#f6f0d7;--panel:#fffdf3;--panel-soft:#f3eed6;--border:#e3ddc0;--border-strong:#cbc6a4;
  --text:#262d1c;--text-dim:#3f4830;--text-faint:#636b52;
  --brand:#c5d89d;--on-brand:#25301a;--on-brand-dim:#4a5838;
  --accent-ink:#56653f;--accent-soft:rgba(156,171,132,.2);--accent-line:rgba(137,152,109,.45);
  --btn:#89986d;--on-btn:#1c2413;--bar:#89986d;
  --a1:#56653f;--a2:#89986d;--a3:#9cab84;--a4:#c5d89d}
/* ── 다 블루 ── */
.p3{--bg:#f9f7f7;--panel:#ffffff;--panel-soft:#eef1f7;--border:#dfe4ec;--border-strong:#c3cbd9;
  --text:#112d4e;--text-dim:#2f4664;--text-faint:#5a6b82;
  --brand:#112d4e;--on-brand:#fff;--on-brand-dim:#b9c9e0;
  --accent-ink:#3f72af;--accent-soft:#dbe2ef;--accent-line:rgba(63,114,175,.35);
  --btn:#3f72af;--on-btn:#fff;--bar:#3f72af;
  --a1:#112d4e;--a2:#3f72af;--a3:#8fa9cf;--a4:#dbe2ef}
/* ── 라 로즈 ── */
.p4{--bg:#fcf8f8;--panel:#ffffff;--panel-soft:#fbefef;--border:#f3e0e0;--border-strong:#e6c6c7;
  --text:#3a2224;--text-dim:#5a3c3f;--text-faint:#7f6264;
  --brand:#f5afaf;--on-brand:#3a1d20;--on-brand-dim:#6e3f43;
  --accent-ink:#a8474e;--accent-soft:#fbefef;--accent-line:rgba(245,175,175,.8);
  --btn:#f5afaf;--on-btn:#3a1d20;--bar:#e8888c;
  --a1:#a8474e;--a2:#e8888c;--a3:#f5afaf;--a4:#f9dfdf}
</style>
</head>
<body>
<h1>4차 목업 16 · 색 조합 넷<small>보내 준 색표 넷을 지금 홈 화면에 그대로 입혔습니다. 견본 줄의 점선 칸은 색표 색이 글자로 쓰기엔 옅어서 같은 계열에서 진하게 뽑은 글자용 색입니다. 매수 초록 · 매도 빨강은 그대로, 비중 신호와 고른 탭 · 링크는 조합의 강조색. 데이터는 가짜.</small></h1>
<div class="grid" id="g"></div>
<script>
const P = {
  home: [['M3.8 11.2 10.7 5a2 2 0 0 1 2.6 0l6.9 6.2V19a1.5 1.5 0 0 1-1.5 1.5H5.3A1.5 1.5 0 0 1 3.8 19z', 1], ['M12 14.5v3']],
  stocks: [['M7 3.5v3M7 15.5v4M17 4.5v4M17 15.5v4'], ['M5 6.5h4v9H5z', 1], ['M15 8.5h4v7h-4z', 1]],
  rebalance: [['M20.5 12A8.5 8.5 0 1 1 12 3.5M17 12a5 5 0 1 1-5-5'], ['M12 3.5A8.5 8.5 0 0 1 20.5 12H17a5 5 0 0 0-5-5z', 1]],
  macro: [['M3.5 16.5a8.5 8.5 0 1 1 17 0z', 1], ['M12 16.5l3.5-5'], ['M3.5 16.5h17']],
  settings: [['M18.66 9.84L20.55 10.37Q21.60 12.00 20.55 13.63L18.66 14.16L17.20 16.68L17.68 18.59Q16.80 20.31 14.86 20.22L13.46 18.85L10.54 18.85L9.14 20.22Q7.20 20.31 6.32 18.59L6.80 16.68L5.34 14.16L3.45 13.63Q2.40 12.00 3.45 10.37L5.34 9.84L6.80 7.32L6.32 5.41Q7.20 3.69 9.14 3.78L10.54 5.15L13.46 5.15L14.86 3.78Q16.80 3.69 17.68 5.41L17.20 7.32Z'], ['M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z']],
  refresh: [['M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4']],
}
const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n].map(([d, f]) => `<path d="${d}"${f ? ' class="f"' : ''}/>`).join('')}</svg>`
const TABS = [['home', '홈'], ['stocks', '종목'], ['rebalance', '리밸런싱'], ['macro', '매크로'], ['settings', '설정']]
const B = {
  buy: '<span class="badge b-buy"><i class="shape tri-up"></i>매수</span>',
  sell: '<span class="badge b-sell"><i class="shape tri-dn"></i>매도</span>',
  over: '<span class="badge b-wt"><i class="shape dia"></i>비중 초과</span>',
}
const ROWS = [
  ['삼성전자', '120주 · 비중 31%', 31, 30, '38,412,000', '+12.4%', 'up', B.buy],
  ['QQQ', '18주 · 비중 27%', 27, 22, '33,580,200', '+21.8%', 'up', B.over],
  ['SK하이닉스', '40주 · 비중 19%', 19, 20, '23,960,000', '−4.2%', 'down', ''],
  ['도요타자동차', '60주 · 비중 11%', 11, 13, '13,870,500', '+3.1%', 'up', B.sell],
]
const SETS = [
  ['p1', '가 · 네이비 · 베이지', ['#213448', '#547792', '#94b4c1', '#eae0cf'], [['#40637d', '글자용']]],
  ['p2', '나 · 세이지', ['#f6f0d7', '#c5d89d', '#9cab84', '#89986d'], [['#56653f', '글자용']]],
  ['p3', '다 · 블루', ['#f9f7f7', '#dbe2ef', '#3f72af', '#112d4e'], []],
  ['p4', '라 · 로즈', ['#fcf8f8', '#fbefef', '#f9dfdf', '#f5afaf'], [['#a8474e', '글자용']]],
]
const phone = cls => `<div class="phone ${cls}">
  <div class="status"><span class="num">8:12</span><span>●●● ▮</span></div>
  <div class="top"><b>자산관리</b><span class="fresh">방금 받음</span><span class="ic">${ic('refresh')}</span></div>
  <div class="scroll">
    <div class="card sum">
      <div class="t"><span>총 평가금액</span><a>금액 가리기</a></div>
      <div class="big num">124,630,700원</div>
      <div class="g">
        <div><span>평가손익</span><b class="num up">+11,284,300</b></div>
        <div><span>수익률</span><b class="num up">+9.96%</b></div>
        <div><span>전일 대비</span><b class="num down">−342,100</b></div>
        <div><span>다음 리뷰</span><b class="num">12월 2일</b></div>
      </div>
      <div class="alloc"><i style="width:31%;background:var(--a1)"></i><i style="width:27%;background:var(--a2)"></i><i style="width:19%;background:var(--a3)"></i><i style="width:11%;background:var(--a4)"></i><i style="flex:1;background:var(--border-strong)"></i></div>
      <div class="leg"><span style="--c:var(--a1)">삼성전자</span><span style="--c:var(--a2)">QQQ</span><span style="--c:var(--a3)">SK하이닉스</span><span style="--c:var(--a4)">도요타</span><span style="--c:var(--border-strong)">현금</span></div>
    </div>
    <div class="card tiles">
      <div style="color:var(--buy)"><b class="num">1</b><span>▲ 매수</span></div>
      <div style="color:var(--sell)"><b class="num">1</b><span>▼ 매도</span></div>
      <div style="color:var(--accent-ink)"><b class="num">1</b><span>◆ 비중</span></div>
    </div>
    <div class="airow"><div><b>AI 진단</b><small>반도체 비중이 목표보다 조금 많아요</small></div><span class="go">›</span></div>
    <div class="sech">보유 <small class="num">4종목</small><span class="seg"><span class="on">평가금액</span><span>수익률</span></span></div>
    <div class="list">
      <div class="lh"><span>종목 · 비중과 목표</span><span>평가금액 · 수익률</span></div>
      ${ROWS.map(([n, s, w, t, v, r, d, b]) => `<div class="row"><div class="nm"><b>${n}</b><small class="num">${s}</small><div class="wbar"><i style="width:${w * 2.5}%"></i><u style="left:${t * 2.5}%"></u></div>${b}</div><div class="v"><b class="num">${v}</b><small class="num ${d}">${r}</small></div></div>`).join('')}
    </div>
  </div>
  <nav class="tabbar">${TABS.map(([k, n], i) => `<a class="${i === 0 ? 'on' : ''}">${ic(k)}${n}</a>`).join('')}</nav>
</div>`
document.getElementById('g').innerHTML = SETS.map(([cls, name, pal, ink]) => `<div class="col">
  <div class="cap">${name}</div>
  <div class="pal">${pal.map(c => `<i style="--c:${c}">${c}</i>`).join('')}${ink.map(([c, l]) => `<i class="ink" style="--c:${c}">${l}</i>`).join('')}</div>
  ${phone(cls)}
</div>`).join('')
</script>
</body>
</html>
