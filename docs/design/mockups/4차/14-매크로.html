<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4차 매크로</title>
<!--
  디자인 4차 목업 14 — 묶음 5 매크로. 목업 13(묶음 4)에서 이미 카드 12장 → 한 목록 · 받은 시각 위에 한 번 · 반짝이 · 📐 를 뺐다.
  여기서 정할 것(넘어온 것, status.md 묶음 5):
  ① ★ 의 뜻 — 지금은 "홈 화면에 올리기"인데 로그인한 홈에는 매크로 줄이 없다(4차 ㉡ 에서 뺌). 눌러도 보이는 일이 없다(사용자 확인 2 못 끝낸 과업).
     가 "내 지표"로 목록 맨 위에 모으기 / 나 홈 요약 아래 한 줄로 다시(★ 지표만) / 다 ★ 빼기
  ② 줄 아래 붙는 것 — 전년비 배지 · 예상치 입력(관리자) · 예상/실제 줄이 줄마다 붙어 목록이 길다.
     가 지금 그대로 / 나 풀이 한 줄로 모으고 예상치 입력은 차트 창 안으로
  ③ 달 표시 · 지표 코드 — "월간 10월"(연도 없음) · 차트 창 제목 옆 "CPIAUCSL" 같은 코드
  기본은 라이트, ?theme=dark 로 다크. 색 · 글꼴은 앱 tokens.css. 데이터는 가짜.
-->
<link rel="stylesheet" href="../../../../frontend/src/styles/tokens.css">
<style>

*{box-sizing:border-box;margin:0;padding:0}
html{background:#6b7280}
body{font-family:var(--font-sans);word-break:keep-all;padding:24px;display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1700px;margin:0 auto;color:var(--text)}
.part{width:100%;color:#fff;font-size:20px;font-weight:700;padding:18px 0 0;border-top:1px solid rgba(255,255,255,.3)}
.part:first-child{border-top:0;padding-top:0}
.part small{display:block;font-size:13px;font-weight:400;opacity:.9;margin-top:4px;max-width:1100px;line-height:1.5}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font-weight:600;font-size:15px;color:#fff;text-align:center;line-height:1.35;max-width:390px}
.cap small{display:block;font-weight:400;font-size:12px;opacity:.88;margin-top:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.phone{width:390px;height:844px;position:relative;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);background:var(--bg);display:flex;flex-direction:column;color:var(--text)}
.phone.short{height:auto;padding-bottom:16px}
.scroll{flex:1;overflow:hidden;padding-bottom:84px}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;background:var(--brand);color:var(--on-brand)}
.top{background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:4px;padding:2px 8px 8px 16px;flex:none}
.top b{font-size:17px;font-weight:700;flex:1}
.top .fresh{font-size:12px;color:var(--on-brand-dim);margin-right:4px}
.ic{width:44px;height:44px;display:grid;place-items:center;flex:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;padding:8px 6px 26px;background:var(--panel);border-top:1px solid var(--border);color:var(--text-faint)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-caption)}
.tabbar .on{color:var(--accent);font-weight:600}
.tabbar .on svg path.f{fill:currentColor}
.shape{display:inline-block;width:.68em;height:.68em;margin-right:3px;vertical-align:0;background:currentColor}
.tri-up{clip-path:polygon(50% 0,100% 100%,0 100%)}.tri-dn{clip-path:polygon(0 0,100% 0,50% 100%)}.dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.badge{display:inline-flex;align-items:center;font-size:var(--fs-caption);font-weight:600;white-space:nowrap;border-radius:6px;padding:2px 6px}
.b-buy{color:var(--signal-buy);background:var(--signal-buy-soft)}
.b-sell{color:var(--signal-sell);background:var(--signal-sell-soft)}
.b-wt{color:var(--signal-weight);background:var(--signal-weight-soft)}
.up{color:var(--up)} .down{color:var(--down)} .faint{color:var(--text-faint)} .dim{color:var(--text-dim)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.hint{font-size:var(--fs-caption);color:var(--text-faint);line-height:1.5}
.go{color:var(--text-faint);flex:none}
a.lk{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.hl{outline:2px dashed var(--amber);outline-offset:2px;border-radius:4px}

/* 홈 요약 (지금 · 바꾼 것 같음) */
.sum{margin:12px 16px 0;padding:14px 16px}
.sum .t{display:flex;justify-content:space-between;font-size:var(--fs-sub);font-weight:600}
.sum .big{font-family:var(--font-summary-num);font-size:28px;font-weight:700;letter-spacing:-.02em;margin:6px 0 10px}
.sum .g{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.sum .g span{display:block;font-size:var(--fs-caption);color:var(--text-faint)}
.sum .g b{font-family:var(--font-summary-num);font-size:var(--fs-strong);font-weight:700}
.sum .foot{margin-top:10px}
/* 신호 칸 셋 */
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);margin:8px 16px 0}
.tiles3 > div{text-align:center;padding:10px 4px}
.tiles3 > div + div{border-left:1px solid var(--border)}
.tiles3 b{display:block;font-size:22px;font-weight:700}
.tiles3 span{font-size:var(--fs-caption);font-weight:600}
.tiles3.flat{margin:4px 16px 0}
/* AI 줄 */
.airow{display:flex;align-items:center;gap:10px;margin:8px 16px 0;padding:12px 14px}
.airow b{display:block;font-size:var(--fs-body)}
.airow small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.airow .sp{color:var(--accent);font-size:18px}
.airow.flat{margin:0;padding:12px 16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--panel)}
.airow.flat .go{margin-left:auto}
/* 보유 목록 */
.sech{display:flex;align-items:baseline;gap:6px;padding:16px 16px 8px;font-size:var(--fs-strong);font-weight:700}
.sech small{font-size:var(--fs-caption);color:var(--text-faint);font-weight:600}
.list{background:var(--panel)}
.list.boxed{margin:0 16px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.list.flat{border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.lh{display:flex;justify-content:space-between;padding:8px 14px;font-size:var(--fs-caption);color:var(--text-faint);background:var(--panel-soft);border-bottom:1px solid var(--border)}
.row{display:flex;gap:10px;padding:10px 14px;align-items:flex-start}
.row + .row{border-top:1px solid var(--border)}
.list.flat .row{padding:10px 16px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:var(--fs-body);font-weight:600}
.row .nm small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.row .nm .badge{margin-top:6px}
.row .v{text-align:right}
.row .v b{display:block;font-size:var(--fs-body);font-weight:700}
.row .v small{display:block;font-size:var(--fs-caption);margin-top:2px}

/* 매크로 */
.mh{padding:14px 16px 4px}
.mh b{font-size:var(--fs-title);font-weight:700}
.mh p{margin-top:4px}
.band{display:flex;align-items:center;gap:8px;margin:8px 16px 0;padding:10px 12px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius);font-size:var(--fs-sub);color:var(--accent)}
.mcard{margin:8px 16px 0;padding:12px 14px}
.mcard .n{display:flex;justify-content:space-between;font-size:var(--fs-strong);font-weight:700}
.mcard .n u{text-decoration:underline dotted;text-underline-offset:3px}
.mcard .v{font-size:26px;font-weight:700;margin:6px 0 4px}
.mcard .v small{font-size:var(--fs-sub);font-weight:500;margin-left:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px}
.mrow + .mrow{border-top:1px solid var(--border)}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-size:var(--fs-body);font-weight:600}
.mrow .nm small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.mrow .v{text-align:right}
.mrow .v b{display:block;font-size:var(--fs-strong);font-weight:700}
.mrow .v small{display:block;font-size:var(--fs-caption);margin-top:1px}
.mrow .st{width:20px;text-align:center;color:var(--text-faint)}
.mrow .st.on{color:var(--amber)}
.subh{display:flex;justify-content:space-between;padding:14px 16px 6px;font-size:var(--fs-caption);font-weight:600;color:var(--text-faint)}

/* 단추 */
.tb{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.pillb{border:1px solid var(--border-strong);background:var(--panel);border-radius:999px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sub);font-weight:600}
.pillb.on{border:2px solid var(--accent)}
.pillb.amb{background:var(--amber-soft);border-color:transparent;color:var(--amber);border-radius:6px;height:28px;font-size:var(--fs-caption)}
.seg{display:inline-flex;background:var(--panel-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg span{height:34px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-sub);font-weight:600;color:var(--text-dim);border-radius:6px;flex:1}
.seg span.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border-strong)}
.seg.full{display:flex;margin:0 16px}
.sqb{height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--panel);font-size:var(--fs-sub);font-weight:600}
.txtb{height:40px;padding:0 6px;display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-sub);font-weight:600;color:var(--accent)}
.chipf{border:1px solid var(--border);background:var(--panel);border-radius:999px;height:36px;padding:0 12px;display:inline-flex;align-items:center;font-size:var(--fs-sub);color:var(--text-dim)}
.chipf.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.per{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
.per span{height:40px;border:1px solid var(--border);border-radius:999px;display:grid;place-items:center;font-size:var(--fs-sub);font-weight:600;background:var(--panel)}
.per span.on{border:2px solid var(--accent-line);background:var(--accent-soft)}
.lbl{padding:14px 16px 6px;font-size:var(--fs-caption);font-weight:600;color:var(--text-faint)}

/* 글 고치기 표 */
.words{width:1180px;padding:6px 0;overflow:hidden}
.words table{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.words th{font-size:var(--fs-caption);color:var(--text-faint);font-weight:600;text-align:left;padding:10px 14px;background:var(--panel-soft);border-bottom:1px solid var(--border)}
.words td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.words tr:last-child td{border-bottom:0}
.words td:first-child{color:var(--text-faint);font-size:var(--fs-caption);width:150px}
.words td:nth-child(2){color:var(--text-dim)}
.words td:nth-child(3){font-weight:600}
.words td:nth-child(4){color:var(--text-faint);font-size:var(--fs-caption);width:230px}
.words del{text-decoration:none;background:var(--red-soft);color:var(--red);border-radius:3px;padding:0 2px}

/* 색 견본 */
.sw{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.sw i{display:inline-flex;flex-direction:column;gap:3px;font-style:normal;font-size:11px;color:var(--text-faint)}
.sw i::before{content:'';width:40px;height:26px;border-radius:6px;background:var(--c);border:1px solid var(--border)}
/* 로그인 */
.login{margin:16px;padding:20px 18px;text-align:center}
.login.dashed{border:1.5px dashed var(--border-strong);border-radius:var(--radius);background:var(--panel)}
.login.plain{text-align:left;padding:8px 4px}
.login h3{font-size:var(--fs-strong);font-weight:700;margin-bottom:12px}
.login ul{text-align:left;font-size:var(--fs-sub);line-height:1.55;padding-left:18px;color:var(--text-dim)}
.login.plain ul{list-style:none;padding:0;display:grid;gap:10px}
.login.plain li b{display:block;color:var(--text)}
.login .btnb{display:inline-flex;height:48px;align-items:center;justify-content:center;padding:0 22px;border-radius:var(--radius-sm);background:var(--brand);color:var(--on-brand);font-weight:700;font-size:var(--fs-body);margin:16px 0 10px}
.login.plain .btnb{display:flex}
.fine{padding:0 16px;font-size:var(--fs-caption);color:var(--text-faint);line-height:1.5}
/* 14 */
.mrow .tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.more14{padding:0 16px 10px 46px;display:grid;gap:6px}
.more14 .zone{display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-caption);font-weight:600;background:var(--slate-soft);border-radius:6px;padding:4px 8px;width:max-content}
.more14 .fc{font-size:var(--fs-caption);color:var(--text-dim)}
.more14 .lk{font-size:var(--fs-sub)}
.grph{display:flex;justify-content:space-between;padding:14px 16px 6px;font-size:var(--fs-caption);font-weight:700;color:var(--text-dim)}
.grph em{font-style:normal;font-weight:400;color:var(--text-faint)}
.strip{display:flex;gap:8px;overflow:hidden;padding:0 16px;margin-top:8px}
.strip .chip2{flex:none;display:flex;gap:6px;align-items:baseline;border:1px solid var(--border);background:var(--panel);border-radius:var(--radius-sm);padding:8px 10px;font-size:var(--fs-caption);color:var(--text-dim)}
.strip .chip2 b{font-size:var(--fs-body);color:var(--text)}
.modal14{position:absolute;inset:auto 0 0 0;top:110px;background:var(--bg-elevated);border-radius:16px 16px 0 0;box-shadow:var(--shadow-up);padding:14px 16px}
.dimbg{position:absolute;inset:0;background:var(--scrim)}
.modal14 .mh2{display:flex;align-items:baseline;gap:8px}
.modal14 .mh2 b{font-size:var(--fs-strong)}
.modal14 .x{margin-left:auto;width:40px;height:40px;border:1px solid var(--border);border-radius:var(--radius-sm);display:grid;place-items:center}
.chartbox{height:190px;margin:10px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);position:relative;overflow:hidden}
.chartbox svg{position:absolute;inset:0;width:100%;height:100%}
.fbox{border-top:1px solid var(--border);padding-top:10px;display:grid;gap:8px}
.fbox .r{display:flex;gap:8px;align-items:flex-end}
.fbox label{display:grid;gap:4px;font-size:var(--fs-caption);color:var(--text-faint)}
.fbox .in{height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;font-size:var(--fs-body);background:var(--panel);min-width:96px}
.fbox .pb{height:44px;display:flex;align-items:center;padding:0 14px;border-radius:var(--radius-sm);background:var(--brand);color:var(--on-brand);font-weight:700;font-size:var(--fs-sub)}
.cmp{width:820px;padding:4px 0}
.cmp table{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.cmp th{font-size:var(--fs-caption);color:var(--text-faint);text-align:left;padding:10px 14px;background:var(--panel-soft);border-bottom:1px solid var(--border)}
.cmp td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.cmp tr:last-child td{border-bottom:0}
.cmp td:first-child{color:var(--text-faint);font-size:var(--fs-caption);width:120px}
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search)
if (q.get('theme') !== 'dark') document.documentElement.dataset.theme = 'light'
if (q.get('rise') === 'red') document.documentElement.dataset.rise = 'red'
/* 앱 아이콘(iconPaths.ts)에서 가져온 그림 */
const P = {
  home: [['M3.8 11.2 10.7 5a2 2 0 0 1 2.6 0l6.9 6.2V19a1.5 1.5 0 0 1-1.5 1.5H5.3A1.5 1.5 0 0 1 3.8 19z', 1], ['M12 14.5v3']],
  stocks: [['M7 3.5v3M7 15.5v4M17 4.5v4M17 15.5v4'], ['M5 6.5h4v9H5z', 1], ['M15 8.5h4v7h-4z', 1]],
  rebalance: [['M20.5 12A8.5 8.5 0 1 1 12 3.5M17 12a5 5 0 1 1-5-5'], ['M12 3.5A8.5 8.5 0 0 1 20.5 12H17a5 5 0 0 0-5-5z', 1]],
  macro: [['M3.5 16.5a8.5 8.5 0 1 1 17 0z', 1], ['M12 16.5l3.5-5'], ['M3.5 16.5h17']],
  settings: [['M18.66 9.84L20.55 10.37Q21.60 12.00 20.55 13.63L18.66 14.16L17.20 16.68L17.68 18.59Q16.80 20.31 14.86 20.22L13.46 18.85L10.54 18.85L9.14 20.22Q7.20 20.31 6.32 18.59L6.80 16.68L5.34 14.16L3.45 13.63Q2.40 12.00 3.45 10.37L5.34 9.84L6.80 7.32L6.32 5.41Q7.20 3.69 9.14 3.78L10.54 5.15L13.46 5.15L14.86 3.78Q16.80 3.69 17.68 5.41L17.20 7.32Z'], ['M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z']],
  more: [['M4.5 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M11 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M17.5 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0']],
  edit: [['M4 20h4L19 9l-4-4L4 16z'], ['M13.5 6.5l4 4']],
  doc: [['M5.5 3.5h13v17h-13z'], ['M9 8.5h6M9 12h6M9 15.5h3.5']],
  refresh: [['M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4']],
  chev: [['M6 9l6 6 6-6']],
}
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${P[n].map(([d, f]) => `<path d="${d}"${f ? ' class="f"' : ''}/>`).join('')}</svg>`
const status = () => `<div class="status"><span class="num">8:12</span><span>●●● ▮</span></div>`
const topBar = () => `<div class="top"><b>자산관리</b><span class="fresh">방금 받음</span><span class="ic">${ic('refresh')}</span></div>`
const TABS = [['home', '홈'], ['stocks', '종목'], ['rebalance', '리밸런싱'], ['macro', '매크로'], ['settings', '설정']]
const tabbar = (on = 2) => `<nav class="tabbar">${TABS.map(([k, n], i) => `<a class="${i === on ? 'on' : ''}">${ic(k)}${n}</a>`).join('')}</nav>`
const sh = { buy: '<i class="shape tri-up"></i>', sell: '<i class="shape tri-dn"></i>', wt: '<i class="shape dia"></i>' }
const col = (cap, sub, body) => `<div class="col"><div class="cap">${cap}<small>${sub}</small></div>${body}</div>`
const part = (t, s) => `<div class="part">${t}<small>${s}</small></div>`
const phone = (inner, cls = '') => `<div class="phone ${cls}">${inner}</div>`
const chev = `<svg class="i s" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`
const out = []

/* 이름, 풀이, 값, 변화, 별, 주기, 꼬리표, 구간, 예상 */
const M = [
  ['VIX', '변동성 지수 · 시장의 공포', '21.1', '−1.3', 1, 'd'],
  ['공포·탐욕 지수', '0 공포 ~ 100 탐욕', '43.1', '−0.1', 1, 'd', '', '공포 구간 <span class="faint">25~44</span>'],
  ['S&P 500', '미국 대형주 500개', '5,786.7', '+41.2', 0, 'd'],
  ['코스피', '한국 대표 지수', '3,294.7', '+53.4', 0, 'd'],

/* ② 줄 아래 */

out.push(col('가 · 지금', '관리자 화면 — 월간 셋이 줄마다 세 줄씩 늘어남', phone(`${status()}${topBar()}<div class="scroll">${head()}<div class="list flat" style="margin-top:10px">${M.slice(1, 2).concat(M.slice(5, 8)).map((m) => rowNow(m)).join('')}</div></div>${tabbar(3)}`)))

  <div class="seg full" style="display:flex;margin:10px 0 0"><span>1년</span><span class="on">5년</span><span>10년</span><span>전체</span></div>

const C = [
  ['월간 지표 달', '근원 PCE — "연준이 보는 물가, 월간 10월"', '"…, 2026년 10월분" — 1월이면 지난해 12월분이 섞여 연도가 필요', '"…, 10월분" — 짧게, 연도는 차트 창에서'],
