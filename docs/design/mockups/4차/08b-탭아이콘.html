<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4차 탭 아이콘 후보</title>
<!--
  디자인 4차 목업 08b — 주인: "1(둥근 선)이 좋긴 해. 근데 메뉴 그림들이 마음에 안 들어."
  아래 탭 다섯의 그림을 탭마다 후보 넷으로. 모양은 1 · 둥근 선 1.75, 켜지면 속을 채움.
  칸마다 꺼짐 · 켜짐(라이트) · 꺼짐 · 켜짐(다크). 맨 아래는 추천을 모은 탭 줄.
-->
<style>
@font-face{font-family:'Pretendard';src:url('../assets/PretendardVariable-ko.woff2') format('woff2');font-weight:400 700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#6b7280}
body{font-family:'Pretendard',system-ui,sans-serif;word-break:keep-all;padding:24px;display:flex;flex-direction:column;gap:18px;max-width:1240px;margin:0 auto;color:#fff}
.tab{display:grid;grid-template-columns:110px repeat(4,1fr);gap:10px;align-items:stretch}
.tab>b{font-size:16px;align-self:center}
.c{border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.c .nm{font-size:13px;font-weight:600;padding:6px 10px;background:#4b5563;display:flex;justify-content:space-between}
.c .nm i{font-style:normal;font-size:11px;background:#fff;color:#111827;border-radius:5px;padding:1px 5px}
.c .ic{display:flex}
.c .ic>span{flex:1;display:grid;place-items:center;padding:14px 0}
.L{--surf:#fff;--link:#0051a8;--faint:#5b6472;background:#fff;color:#5b6472}
.D{--surf:#0d1627;--link:#92b1db;--faint:#909aab;background:#0d1627;color:#909aab}
.on{color:var(--link)}
.on .pill{background:color-mix(in srgb,var(--link) 14%,transparent);border-radius:999px;padding:3px 14px}
.bars{display:flex;gap:16px}
.bar{flex:1;border-radius:14px;overflow:hidden}
.bar nav{display:flex;padding:8px 6px 12px}
.bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500}
.bar .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center}
.bar a.on{font-weight:700}
.bar a.on .pill{background:color-mix(in srgb,var(--link) 14%,transparent)}
h2{font-size:16px;margin-top:8px}
</style>
</head>
<body>
<script>
// [d, 닫힘(켜지면 채움), 켜지면 바탕색으로 뚫을 선]
const T = {
  홈: [
    ['집', [['M4 10.2 12 4l8 6.2V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z', 1], ['M9.5 20.5V15h5v5.5', 0, 1]]],
    ['둥근 집', [['M3.8 11.2 10.7 5a2 2 0 0 1 2.6 0l6.9 6.2V19a1.5 1.5 0 0 1-1.5 1.5H5.3A1.5 1.5 0 0 1 3.8 19z', 1], ['M12 14.5v3', 0, 1]], 1],
    ['원형 비중', [['M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12z', 1], ['M14.5 2.8a8.5 8.5 0 0 1 6.7 6.7h-6.7z', 1]]],
    ['지갑', [['M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3H6.5', 0], ['M4 7.5V18a2 2 0 0 0 2 2h14V9H6.5A2.5 2.5 0 0 1 4 7.5', 1], ['M16 14.5h.01', 0, 1]]],
  ],
  종목: [
    ['막대 (지금)', [['M3.5 20h17', 0], ['M5.5 11h3v6h-3z', 1], ['M10.5 5.5h3V17h-3z', 1], ['M15.5 8.5h3V17h-3z', 1]]],
    ['캔들', [['M7 3.5v3M7 15.5v4M17 4.5v4M17 15.5v4', 0], ['M5 6.5h4v9H5z', 1], ['M15 8.5h4v7h-4z', 1]], 1],
    ['오르는 선', [['M3.5 17.5 9 12l3.5 3.5 8-8', 0], ['M15 7.5h5.5V13', 0]]],
    ['목록 + 차트', [['M4 5.5h16v13H4z', 1], ['M7 15l3-3.5 2.5 2 4.5-5', 0, 1]]],
  ],
  리밸런싱: [
    ['저울 (지금)', [['M12 4.5V19.5M8 19.5h8M5 7.5h14', 0], ['M5 7.5 2.5 13a2.5 2.5 0 0 0 5 0z', 1], ['M19 7.5 16.5 13a2.5 2.5 0 0 0 5 0z', 1]]],
    ['도넛 비중', [['M20.5 12A8.5 8.5 0 1 1 12 3.5M17 12a5 5 0 1 1-5-5', 0], ['M12 3.5A8.5 8.5 0 0 1 20.5 12H17a5 5 0 0 0-5-5z', 1]], 1],
    ['맞바꾸기', [['M4 8.5h14.5M15 5l3.5 3.5L15 12', 0], ['M20 15.5H5.5M9 12l-3.5 3.5L9 19', 0]]],
    ['조절 막대', [['M5 4v16M12 4v16M19 4v16', 0], ['M5 14.5a2 2 0 1 0 0 .01zM12 8.5a2 2 0 1 0 0 .01zM19 12.5a2 2 0 1 0 0 .01z', 1]]],
  ],
  매크로: [
    ['지구 (지금)', [['M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17z', 1], ['M3.5 12h17M12 3.5c3 3.2 3 13.8 0 17M12 3.5c-3 3.2-3 13.8 0 17', 0, 1]]],
    ['계기판', [['M3.5 16.5a8.5 8.5 0 1 1 17 0z', 1], ['M12 16.5l3.5-5', 0, 1], ['M3.5 16.5h17', 0]], 1],
    ['맥박 지표', [['M3 12.5h3.5l2.5-6 4 11 2.5-5H21', 0]]],
    ['은행', [['M3.5 9 12 4l8.5 5z', 1], ['M5.5 11v6.5M10 11v6.5M14 11v6.5M18.5 11v6.5M3.5 20.5h17', 0]]],
  ],
  설정: [
    ['톱니 (지금)', 'gear8'],
    ['둥근 톱니', 'gearR', 1],
    ['조절', [['M4 7h9M17 7h3M4 17h3M11 17h9', 0], ['M15 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM9 14.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z', 1]]],
    ['사람', [['M12 4a3.8 3.8 0 1 0 0 7.6A3.8 3.8 0 0 0 12 4z', 1], ['M4.5 20.5a7.5 7.5 0 0 1 15 0z', 1]]],
  ],
}
const gear = (n, R, r, round) => {
  let d = ''
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, w = Math.PI / n, p = (rad, ang) => `${(12 + rad * Math.cos(ang)).toFixed(2)} ${(12 + rad * Math.sin(ang)).toFixed(2)}`
    if (!round) d += (i ? 'L' : 'M') + [p(r, a - w * 0.62), p(R, a - w * 0.34), p(R, a + w * 0.34), p(r, a + w * 0.62)].join('L')
    else d += (i ? 'L' : 'M') + p(r, a - w * 0.6) + `L${p(R - 0.6, a - w * 0.36)}Q${p(R + 0.3, a)} ${p(R - 0.6, a + w * 0.36)}L${p(r, a + w * 0.6)}`
  }
  return d + 'Z'
}
const hole = ['M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', 0, 1]
const shape = (s) => s === 'gear8' ? [[gear(8, 9.2, 7, false), 1], hole] : s === 'gearR' ? [[gear(6, 9.3, 7, true), 1], hole] : s
const svg = (els, on, size = 26) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${shape(els).map(([d, c, k]) => on ? (c ? `<path d="${d}" fill="currentColor"/>` : `<path d="${d}"${k ? ' stroke="var(--surf)"' : ''}/>`) : `<path d="${d}"/>`).join('')}</svg>`
const cell = ([nm, els, rec]) => `<div class="c"><div class="nm">${nm}${rec ? '<i>추천</i>' : ''}</div><div class="ic">
  <span class="L">${svg(els, false)}</span><span class="L on"><span class="pill">${svg(els, true)}</span></span>
  <span class="D">${svg(els, false)}</span><span class="D on"><span class="pill">${svg(els, true)}</span></span></div></div>`
const pickOf = (name) => T[name].find(x => x[2]) || T[name][0]
const bar = (cls, on) => `<div class="bar ${cls}"><nav>${Object.keys(T).map((n, i) => `<a class="${i === on ? 'on' : ''}"><span class="pill">${svg(pickOf(n)[1], i === on, 24)}</span>${n}</a>`).join('')}</nav></div>`
document.body.innerHTML = Object.entries(T).map(([n, list]) => `<div class="tab"><b>${n}</b>${list.map(cell).join('')}</div>`).join('') +
  `<h2>추천을 모은 탭 줄 (둥근 집 · 캔들 · 도넛 비중 · 계기판 · 둥근 톱니)</h2><div class="bars">${bar('L', 0)}${bar('D', 0)}</div><div class="bars">${bar('L', 2)}${bar('D', 3)}</div>`
</script>
</body>
</html>
