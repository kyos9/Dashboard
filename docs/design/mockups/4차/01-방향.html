<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4차 방향 목업</title>
<!--
  디자인 4차 — 방향 고르기 목업 (DESIGN_PROMPT v6 "만드는 법 다섯" 1).
  같은 가짜 데이터(가짜 서버 주인 계정과 같은 숫자)로 대시보드 첫 화면을 세 결로 그린다.
    A · 숫자 먼저, 넓게   — 주인이 든 참고: 토스증권 결
    B · 표 먼저, 촘촘하게 — 주인이 든 참고: 증권사 앱(키움·미래에셋) 결
    C · 출근길 안내판     — 앱의 쓰임(출근길에 오늘 할 일 확인)에서 끌어온 결
  색·글꼴은 아직 고르지 않았다. 여기 쓴 메인 색은 결을 보이기 위한 임시 값이고, 03-메인색 목업에서 고른다.
  보는 법: 이 파일을 브라우저로 연다. ?theme=light 로 라이트.
-->
<style>
@font-face{font-family:'Wanted Sans';src:url('../../../../frontend/src/assets/fonts/WantedSansVariable-ko.woff2') format('woff2');font-weight:400 700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#6b7280}
body{font-family:'Wanted Sans',system-ui,sans-serif;word-break:keep-all;padding:24px;display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font:600 15px/1.3 'Wanted Sans',sans-serif;color:#fff;text-align:center}
.cap small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
.phone{width:390px;height:844px;overflow:hidden;position:relative;border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.num{font-variant-numeric:tabular-nums}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;padding:8px 6px 26px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;text-decoration:none}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shape{display:inline-block;width:.7em;height:.7em;margin-right:3px;vertical-align:0}
.tri-up{clip-path:polygon(50% 0,100% 100%,0 100%);background:currentColor}
.tri-dn{clip-path:polygon(0 0,100% 0,50% 100%);background:currentColor}
.dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:currentColor}
.slot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1.5px dashed currentColor;opacity:.55;font-size:10px}

/* ============ A · 숫자 먼저, 넓게 ============ */
.A{--bg:#f2f4f6;--surf:#fff;--text:#191f28;--dim:#4e5968;--faint:#6b7684;--line:#e5e8eb;--main:#2563eb;--main-soft:#e8efff;--up:#15803d;--down:#dc2626;--buy:#15803d;--sell:#dc2626;--wt:#7e22ce;background:var(--bg);color:var(--text)}
.dark .A{--bg:#101318;--surf:#1b1f26;--text:#eef1f4;--dim:#b0b8c1;--faint:#8b95a1;--line:#2a2f37;--main:#5b8def;--main-soft:#1d2a44;--up:#34c46a;--down:#f26a6a;--buy:#34c46a;--sell:#f26a6a;--wt:#c18cf5}
.A .top{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px}
.A .top b{font-size:20px;font-weight:700}
.A .top .ic{display:flex;gap:6px}
.A .top .ic span{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--dim)}
.A .seg{margin:0 20px 14px;background:var(--line);border-radius:12px;padding:3px;display:flex}
.A .seg span{flex:1;text-align:center;padding:9px 0;font-size:14px;font-weight:600;color:var(--faint);border-radius:9px}
.A .seg .on{background:var(--surf);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.A .card{background:var(--surf);border-radius:20px;margin:0 12px 12px;padding:20px}
.A .lbl{font-size:13px;color:var(--faint);font-weight:500}
.A .big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
.A .pl{font-size:15px;font-weight:600;color:var(--up)}
.A .row2{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.A .row2 div{flex:1}
.A .row2 .v{font-size:15px;font-weight:600;margin-top:3px}
.A h3{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.A h3 small{font-size:13px;font-weight:500;color:var(--main)}
.A .todo{display:flex;align-items:center;gap:12px;padding:10px 0}
.A .todo .cnt{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px}
.A .todo .t{flex:1}
.A .todo .t b{font-size:15px;font-weight:600;display:block}
.A .todo .t span{font-size:13px;color:var(--faint)}
.A .todo .chev{color:var(--faint)}
.A .c-buy{background:color-mix(in srgb,var(--buy) 14%,transparent);color:var(--buy)}
.A .c-sell{background:color-mix(in srgb,var(--sell) 14%,transparent);color:var(--sell)}
.A .c-wt{background:color-mix(in srgb,var(--wt) 14%,transparent);color:var(--wt)}
.A .hold{display:flex;align-items:center;gap:12px;padding:11px 0}
.A .hold .logo{width:36px;height:36px;border-radius:50%;background:var(--main-soft);color:var(--main);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.A .hold .n{flex:1;min-width:0}
.A .hold .n b{font-size:15px;font-weight:600;display:block}
.A .hold .n span{font-size:13px;color:var(--faint)}
.A .hold .p{text-align:right}
.A .hold .p b{font-size:15px;font-weight:600;display:block}
.A .hold .p span{font-size:13px}
.A .tabbar{background:var(--surf);border-top:1px solid var(--line);color:var(--faint)}
.A .tabbar .on{color:var(--text)}

/* ============ B · 표 먼저, 촘촘하게 ============ */
.B{--bg:#eef1f5;--surf:#fff;--head:#1e3a8a;--on-head:#fff;--text:#111827;--dim:#374151;--faint:#5b6472;--line:#dfe3ea;--main:#1e40af;--up:#15803d;--down:#dc2626;--buy:#15803d;--sell:#dc2626;--wt:#7e22ce;background:var(--bg);color:var(--text)}
.dark .B{--bg:#0b0f17;--surf:#121826;--head:#16233f;--on-head:#e8eefc;--text:#e5e9f0;--dim:#c3cad5;--faint:#8e98a8;--line:#222b3b;--main:#7aa2f7;--up:#3ccf71;--down:#f47171;--buy:#3ccf71;--sell:#f47171;--wt:#c18cf5}
.B .status{background:var(--head);color:var(--on-head)}
.B .top{background:var(--head);color:var(--on-head);display:flex;align-items:center;justify-content:space-between;padding:4px 12px 8px 16px}
.B .top b{font-size:17px;font-weight:700}
.B .top .ic{display:flex;gap:2px}
.B .top .ic span{width:44px;height:44px;display:grid;place-items:center}
.B .tabs{display:flex;background:var(--surf);border-bottom:1px solid var(--line)}
.B .tabs span{flex:1;text-align:center;font-size:14px;font-weight:600;padding:12px 0;color:var(--faint);border-bottom:2px solid transparent}
.B .tabs .on{color:var(--main);border-color:var(--main)}
.B .sum{background:var(--surf);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;border-bottom:1px solid var(--line)}
.B .sum .k{font-size:12px;color:var(--faint)}
.B .sum .v{font-size:16px;font-weight:700}
.B .sum .wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
.B .sum .wide .v{font-size:22px}
.B .alert{margin:8px;background:var(--surf);border:1px solid var(--line);border-radius:8px;display:flex}
.B .alert div{flex:1;text-align:center;padding:8px 0;border-right:1px solid var(--line);font-size:12px;color:var(--faint)}
.B .alert div:last-child{border-right:0}
.B .alert b{display:block;font-size:17px;font-weight:700}
.B table{width:100%;border-collapse:collapse;background:var(--surf);font-size:13px}
.B th{font-size:12px;font-weight:500;color:var(--faint);text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.B th:first-child,.B td:first-child{text-align:left}
.B td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.B td b{font-weight:600;display:block}
.B td span{font-size:12px;color:var(--faint)}
.B .sig{font-size:12px;font-weight:600}
.B .tabbar{background:var(--surf);border-top:1px solid var(--line);color:var(--faint)}
.B .tabbar .on{color:var(--main)}

/* ============ C · 출근길 안내판 ============ */
.C{--bg:#eef0f3;--surf:#fff;--board:#14213d;--on-board:#f8fafc;--board-dim:#aab4c6;--text:#16202e;--dim:#3d4a5c;--faint:#5d6a7c;--line:#dde2e9;--main:#d97706;--main-ink:#9a4f00;--up:#15803d;--down:#dc2626;--buy:#4ade80;--sell:#f87171;--wt:#d8b4fe;background:var(--bg);color:var(--text)}
.dark .C{--bg:#0a0f1a;--surf:#121a2a;--board:#0f1a33;--on-board:#f1f5f9;--board-dim:#9aa6bb;--text:#e8edf4;--dim:#c0c9d6;--faint:#8d99ab;--line:#223047;--main:#f5a524;--main-ink:#f5a524;--up:#3ccf71;--down:#f47171}
.C .top{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.C .top b{font-size:18px;font-weight:700}
.C .top .ic{display:flex;gap:4px}
.C .top .ic span{width:44px;height:44px;display:grid;place-items:center;color:var(--dim)}
.C .board{margin:0 12px 12px;background:var(--board);color:var(--on-board);border-radius:16px;padding:14px 14px 6px}
.C .board .bh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.C .board .bh b{font-size:16px;font-weight:700}
.C .board .bh span{font-size:12px;color:var(--board-dim)}
.C .brow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.1);font-size:14px}
.C .brow .k{font-size:13px;font-weight:700}
.C .brow .who{color:var(--on-board)}
.C .brow .who span{color:var(--board-dim);font-size:12px;display:block}
.C .brow .st{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--main)}
.dark .C .brow .st{color:var(--main)}
.C .brow .st.done{color:var(--board-dim)}
.C .k.buy{color:var(--buy)} .C .k.sell{color:var(--sell)} .C .k.wt{color:var(--wt)}
.C .money{margin:0 12px 12px;background:var(--surf);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.C .money .lbl{font-size:13px;color:var(--faint)}
.C .money .big{font-size:28px;font-weight:700;letter-spacing:-.01em}
.C .money .pl{text-align:right;font-size:14px;font-weight:600;color:var(--up)}
.C .money .pl span{display:block;font-size:12px;color:var(--faint);font-weight:400}
.C h3{font-size:15px;font-weight:700;margin:4px 16px 6px;display:flex;justify-content:space-between}
.C h3 small{font-size:13px;font-weight:600;color:var(--main-ink)}
.C .list{margin:0 12px;background:var(--surf);border-radius:16px;padding:0 14px}
.C .li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.C .li:last-child{border-bottom:0}
.C .li b{font-size:15px;font-weight:600}
.C .li .r{text-align:right;font-size:15px;font-weight:600}
.C .li span{font-size:12px;color:var(--faint)}
.C .li .rs{text-align:right;font-size:12px}
.C .tabbar{background:var(--surf);border-top:1px solid var(--line);color:var(--faint)}
.C .tabbar .on{color:var(--main-ink)}
</style>
</head>
<body>
<script>
const light = new URLSearchParams(location.search).get('theme') === 'light'
if (!light) document.documentElement.classList.add('dark')

const ICON = {
  refresh: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  more: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
}
const TABS = [
  ['대시보드', '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'],
  ['재무', '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>'],
  ['리밸런싱', '<path d="M12 4v16M5 20h14M6 8h12M6 8l-3 6h6zM18 8l-3 6h6z"/>'],
  ['매크로', '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'],
  ['더보기', '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'],
]
const tabbar = () => `<nav class="tabbar">${TABS.map(([n, d], i) => `<a class="${i ? '' : 'on'}"><svg viewBox="0 0 24 24">${d}</svg>${n}</a>`).join('')}</nav>`
const status = () => `<div class="status"><span class="num">8:12</span><span>●●● ▮</span></div>`

const HOLD = [
  ['TIGER 미국필라델피아반도체나스닥', '2,000주', '₩38,420,000', '+11.6%', 'up', 'TI'],
  ['VOO', '40주', '₩30,120,551', '+21.9%', 'up', 'VO'],
  ['삼성전자', '1,500주', '₩83,250,000', '−7.4%', 'down', '삼성'],
  ['NVDA', '45주', '₩8,962,310', '+66.7%', 'up', 'NV'],
  ['トヨタ自動車', '300주', '₩7,812,004', '−9.1%', 'down', 'トヨ'],
]

const A = `<div class="phone A">${status()}
  <div class="top"><b>자산관리</b><div class="ic"><span>${ICON.refresh}</span><span>${ICON.more}</span></div></div>
  <div class="seg"><span class="on">포트폴리오</span><span>시그널</span></div>
  <div class="card">
    <div class="lbl">총 평가금액 · 현금 포함</div>
    <div class="big num">525,114,227원</div>
    <div class="pl num">+58,154,466원 (+12.5%)</div>
    <div class="row2"><div><div class="lbl">어제보다</div><div class="v num" style="color:var(--up)">+2,733,187원</div></div><div><div class="lbl">다음 리뷰</div><div class="v num">55일 뒤</div></div></div>
  </div>
  <div class="card">
    <h3>오늘 확인할 것<small>시그널 보기</small></h3>
    <div class="todo"><div class="cnt c-buy num">3</div><div class="t"><b><i class="shape tri-up"></i>매수 시그널</b><span>NVDA · 삼성전자 · SK하이닉스</span></div><span class="chev">›</span></div>
    <div class="todo"><div class="cnt c-sell num">4</div><div class="t"><b><i class="shape tri-dn"></i>매도 시그널 (참고)</b><span>AAPL 외 3종목</span></div><span class="chev">›</span></div>
    <div class="todo"><div class="cnt c-wt num">5</div><div class="t"><b><i class="shape dia"></i>비중조절</b><span>비중 초과 3 · 미달 2</span></div><span class="chev">›</span></div>
  </div>
  <div class="card">
    <h3>보유 종목 <small>15</small></h3>
    ${HOLD.slice(0, 3).map(h => `<div class="hold"><div class="logo">${h[5]}</div><div class="n"><b>${h[0]}</b><span class="num">${h[1]}</span></div><div class="p"><b class="num">${h[2]}</b><span class="num" style="color:var(--${h[4]})">${h[3]}</span></div></div>`).join('')}
  </div>
  ${tabbar()}</div>`

const SIGB = [['buy','tri-up','매수'], null, ['buy','tri-up','매수'], ['buy','tri-up','매수'], ['wt','dia','초과']]
const sigB = i => SIGB[i] ? `<span style="color:var(--${SIGB[i][0]})"><i class="shape ${SIGB[i][1]}"></i>${SIGB[i][2]}</span>` : '<span>—</span>'
const B = `<div class="phone B">${status()}
  <div class="top"><b>자산관리</b><div class="ic"><span>${ICON.refresh}</span><span>${ICON.more}</span></div></div>
  <div class="tabs"><span class="on">포트폴리오</span><span>시그널</span><span>AI 진단</span></div>
  <div class="sum">
    <div class="wide"><span class="k">총 평가금액</span><span class="v num">525,114,227</span></div>
    <div><div class="k">평가손익</div><div class="v num" style="color:var(--up)">+58,154,466</div></div>
    <div><div class="k">수익률</div><div class="v num" style="color:var(--up)">+12.50%</div></div>
    <div><div class="k">전일 대비</div><div class="v num" style="color:var(--up)">+2,733,187</div></div>
    <div><div class="k">다음 리뷰</div><div class="v num">D-55</div></div>
  </div>
  <div class="alert">
    <div><b class="num" style="color:var(--buy)">3</b><i class="shape tri-up" style="color:var(--buy)"></i>매수</div>
    <div><b class="num" style="color:var(--sell)">4</b><i class="shape tri-dn" style="color:var(--sell)"></i>매도</div>
    <div><b class="num" style="color:var(--wt)">5</b><i class="shape dia" style="color:var(--wt)"></i>비중</div>
    <div><b class="num">8</b>관망</div>
  </div>
  <table>
    <tr><th>종목 · 수량</th><th>평가금액</th><th>손익률</th><th>신호</th></tr>
    ${HOLD.map((h, i) => `<tr><td><b>${h[0]}</b><span class="num">${h[1]}</span></td><td class="num">${h[2].slice(1)}</td><td class="num" style="color:var(--${h[4]})">${h[3]}</td><td class="sig">${sigB(i)}</td></tr>`).join('')}
  </table>
  ${tabbar()}</div>`

const C = `<div class="phone C">${status()}
  <div class="top"><b>자산관리</b><div class="ic"><span>${ICON.refresh}</span><span>${ICON.more}</span></div></div>
  <div class="board">
    <div class="bh"><b>오늘 할 일</b><span class="num">11/5 아침 · 미국 장 마감 뒤</span></div>
    <div class="brow"><span class="k buy"><i class="shape tri-up"></i>매수</span><span class="who">NVDA · 삼성전자 · SK하이닉스<span>무릎매수 조건을 채움</span></span><span class="st">확인</span></div>
    <div class="brow"><span class="k sell"><i class="shape tri-dn"></i>매도</span><span class="who">AAPL 외 3종목<span>어깨매도 (참고)</span></span><span class="st">확인</span></div>
    <div class="brow"><span class="k wt"><i class="shape dia"></i>비중</span><span class="who">초과 3 · 미달 2<span>다음 리뷰 55일 뒤</span></span><span class="st done">리뷰 때</span></div>
  </div>
  <div class="money">
    <div><div class="lbl">총 평가금액</div><div class="big num">525,114,227원</div></div>
    <div class="pl num">+12.5%<span>+58,154,466원</span></div>
  </div>
