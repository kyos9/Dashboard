<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4차 종목</title>
<!--
  디자인 4차 목업 11 — 묶음 3 "종목": 종목 탭(목록 · 찾기 · 추가 · 순서) + 종목 안(차트 · 신호 · 재무 · 보유).
  지금: 종목 탭 = 추가 폼 + 표, 차트·재무는 맨 위 단추로 가는 따로 화면, 차트 팝업(차트 · AI 분석), 한 번에 수정 팝업.

  종목 탭   가 · 줄 목록 — 찾기 칸(찾기 = 추가) · 거르기 칩 · 줄마다 현재가·등락·신호. 순서·한 번에 수정은 ⋯
            나 · 카드 두 줄 — 줄 대신 작은 카드(작은 차트 선), 한눈에 오르내림
  공통      찾아서 담기 = 바텀 시트 · 순서 바꾸기(≡ 끌기)
  종목 안   가 · 위 탭 넷 — 차트 · 신호 · 재무 · 보유 를 하나씩 (지금 팝업의 탭을 화면으로)
            나 · 한 장 — 차트 아래로 신호 · 보유 · 재무 · AI 를 이어서 내려 읽기
  묶음 2에서 넘어온 것 — 폰 접힌 시그널 카드 높이: 지금 / 배지를 이름 줄로

  색·글꼴은 앱의 frontend/src/styles/tokens.css 를 그대로 불러 그린다(만드는 법 3). 데이터는 가짜.
  ?theme=light 로 라이트, ?rise=red 로 상승 빨강.
-->
<link rel="stylesheet" href="../../../../frontend/src/styles/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#6b7280}
body{font-family:var(--font-sans);word-break:keep-all;padding:24px;display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1700px;margin:0 auto;color:var(--text)}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.cap{font-weight:600;font-size:15px;color:#fff;text-align:center;line-height:1.35;max-width:390px}
.cap small{display:block;font-weight:400;font-size:12px;opacity:.88;margin-top:2px}
.num{font-variant-numeric:tabular-nums}
.phone{width:390px;height:844px;position:relative;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);background:var(--bg);display:flex;flex-direction:column}
.phone.tall{height:auto;min-height:844px;padding-bottom:84px}
.phone .scroll{flex:1;overflow:hidden;padding-bottom:84px}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;background:var(--brand);color:var(--on-brand)}
.top{background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:4px;padding:2px 8px 8px 16px;flex:none}
.top b{font-size:17px;font-weight:700;flex:1}
.top .fresh{font-size:12px;color:var(--on-brand-dim);margin-right:4px}
.ic{width:44px;height:44px;display:grid;place-items:center;flex:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}
.h1{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.h1 b{font-size:var(--fs-title);font-weight:700;flex:1}
.ghost{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border-radius:var(--radius-sm);color:var(--accent);font-size:var(--fs-sub);font-weight:600}
.search{margin:6px 16px 0;display:flex;align-items:center;gap:8px;height:46px;border:1px solid var(--border-strong);background:var(--panel);border-radius:var(--radius);padding:0 12px;color:var(--text-faint);font-size:var(--fs-body)}
.search.on{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
.search .caret{width:1.5px;height:18px;background:var(--accent);margin-left:-6px}
.chips{display:flex;gap:6px;padding:10px 16px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:var(--fs-sub);color:var(--text-dim);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.chips .sp{flex:1}
.list{background:var(--panel);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);min-height:60px}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:var(--fs-body);font-weight:600;text-wrap:balance}
.row .nm small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.row .px{text-align:right}
.row .px b{display:block;font-size:var(--fs-body);font-weight:600}
.row .px small{display:block;font-size:var(--fs-caption);margin-top:2px}
.row .go{color:var(--text-faint);font-size:18px;width:10px}
.up{color:var(--up)} .dn{color:var(--down)}
.shape{display:inline-block;width:.68em;height:.68em;margin-right:3px;vertical-align:0;background:currentColor}
.tri-up{clip-path:polygon(50% 0,100% 100%,0 100%)}.tri-dn{clip-path:polygon(0 0,100% 0,50% 100%)}.dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.badge{display:inline-flex;align-items:center;font-size:var(--fs-caption);font-weight:600;white-space:nowrap;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.b-buy{color:var(--signal-buy);background:var(--signal-buy-soft)}
.b-sell{color:var(--signal-sell);background:var(--signal-sell-soft)}
.b-wt{color:var(--signal-weight);background:var(--signal-weight-soft)}
.b-plain{color:var(--text-faint);background:var(--slate-soft)}
.link-card{margin:10px 16px 0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:var(--fs-body)}
.link-card small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.link-card .go{margin-left:auto;color:var(--text-faint)}
.link-card .lead{color:var(--accent)}
.sec{font-size:var(--fs-caption);color:var(--text-faint);padding:14px 16px 6px;display:flex;justify-content:space-between}
/* 카드 두 줄 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px 8px;min-height:112px;display:flex;flex-direction:column}
.tile b{font-size:var(--fs-body);font-weight:600;text-wrap:balance}
.tile .t2{font-size:var(--fs-caption);color:var(--text-faint);margin-top:1px}
.tile .sp{margin-top:auto}
.tile svg{width:100%;height:30px;display:block;margin:6px 0 4px}
.tile .pr{display:flex;justify-content:space-between;font-size:var(--fs-sub);font-weight:600}
.tile .badge{margin:4px 0 0;align-self:flex-start}
/* 시트 */
.dim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-elevated);border-radius:16px 16px 0 0;padding:8px 16px 30px;box-shadow:var(--shadow-up)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 12px}
.sheet h3{font-size:var(--fs-strong);font-weight:700}
.sheet .sub{font-size:var(--fs-caption);color:var(--text-faint);margin:2px 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:var(--fs-caption);color:var(--text-dim);margin-bottom:5px}
.field label i{font-style:normal;color:var(--text-faint);margin-left:4px}
.inp{height:46px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 12px;font-size:var(--fs-strong);background:var(--panel)}
.inp.ph{color:var(--text-faint);font-size:var(--fs-body)}
.inp u{text-decoration:none;font-size:var(--fs-sub);color:var(--text-faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.primary{display:flex;align-items:center;justify-content:center;height:50px;border-radius:var(--radius);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:var(--fs-strong)}
:root[data-theme='light'] .primary{background:var(--brand);color:var(--on-brand)}
.hint{font-size:var(--fs-caption);color:var(--text-faint);line-height:1.5;margin-top:10px;text-wrap:pretty}
.result{background:var(--panel);margin:8px 16px 0;border:1px solid var(--border);border-radius:var(--radius)}
.result .row{min-height:56px}
.result .add{color:var(--accent);font-size:var(--fs-sub);font-weight:600;display:flex;align-items:center;gap:2px}
.result .have{font-size:var(--fs-caption);color:var(--text-faint)}
mark{background:none;color:var(--accent);font-weight:700}
/* 순서 */
.row.drag{background:var(--panel-soft);box-shadow:var(--shadow-pop);border-radius:var(--radius-sm);position:relative;z-index:1;transform:translateY(-6px) scale(1.01)}
.grip{color:var(--text-faint);width:28px;display:grid;place-items:center}
.done{background:var(--accent);color:var(--on-accent);border-radius:var(--radius-sm);padding:0 18px;height:44px;display:inline-flex;align-items:center;font-weight:700;font-size:var(--fs-sub)}
.banner{margin:0 16px 8px;font-size:var(--fs-caption);color:var(--text-faint)}
/* 종목 안 */
.back{display:flex;align-items:center;gap:2px;background:var(--panel);border-bottom:1px solid var(--border);padding:0 4px;height:52px;flex:none}
.back .ic{color:var(--accent)}
.back b{font-size:var(--fs-strong);font-weight:700;flex:1}
.hero{background:var(--panel);padding:4px 16px 12px}
.hero .t{font-size:var(--fs-caption);color:var(--text-faint)}
.hero .p{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.hero .p b{font-size:var(--fs-big);font-weight:700;letter-spacing:-.01em}
.hero .p span{font-size:var(--fs-sub);font-weight:600}
.hero .badges{margin-top:6px}
.hero .badges .badge{margin:0 6px 0 0}
.utabs{display:flex;background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.utabs span{flex:1;text-align:center;font-size:var(--fs-body);font-weight:600;padding:12px 0 11px;color:var(--text-faint);border-bottom:2px solid transparent;position:relative}
.utabs .on{color:var(--accent);border-color:var(--accent)}
.utabs .dot::after{content:'';position:absolute;top:10px;margin-left:3px;width:6px;height:6px;border-radius:50%;background:var(--signal-buy)}
.chart{background:var(--panel);padding:8px 8px 6px}
.chart .cap2{font-size:var(--fs-caption);color:var(--text-faint);padding:0 8px 6px}
.chart svg{width:100%;display:block}
.periods{display:flex;gap:6px;padding:8px 12px 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.periods span{flex:1;text-align:center;border-radius:var(--radius-sm);padding:9px 0;font-size:var(--fs-sub);color:var(--text-dim);border:1px solid var(--border)}
.periods .on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.legend{font-size:var(--fs-caption);color:var(--text-faint);padding:8px 16px;display:flex;gap:14px;flex-wrap:wrap}
.card2{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin:8px 12px 0;padding:12px 14px}
.card2 h4{font-size:var(--fs-body);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card2 h4 .more{margin-left:auto;font-size:var(--fs-caption);font-weight:500;color:var(--accent)}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.cond{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sub);border-radius:999px;padding:5px 10px;border:1px solid var(--border);color:var(--text-dim)}
.cond.ok{border-color:var(--signal-buy-line);color:var(--signal-buy);background:var(--signal-buy-soft)}
.cond.ok::before{content:'✓';font-weight:700}
.cond.no::before{content:'·'}
.kv{display:grid;grid-template-columns:1fr auto;row-gap:8px;column-gap:10px;font-size:var(--fs-body)}
.kv dt{color:var(--text-dim)}
.kv dd{text-align:right;font-weight:600}
.kv dd small{display:block;font-size:var(--fs-caption);font-weight:400;color:var(--text-faint)}
.kv2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
.kv2 div{display:flex;flex-direction:column}
.kv2 span{font-size:var(--fs-caption);color:var(--text-faint)}
.kv2 b{font-size:var(--fs-strong);font-weight:700;margin-top:1px}
.kv2 em{font-style:normal;font-size:var(--fs-caption);color:var(--text-faint)}
.bar{height:6px;border-radius:3px;background:var(--panel-soft);position:relative;margin:6px 0 2px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.ai-row{display:flex;align-items:center;gap:10px;margin:8px 12px 0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:var(--fs-body)}
.ai-row small{display:block;font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.ai-row .lead{color:var(--accent)}
.ai-row .go{margin-left:auto;color:var(--text-faint)}
.btn2{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:0 12px;height:44px;font-size:var(--fs-sub);font-weight:600;color:var(--text)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;padding:8px 6px 26px;background:var(--panel);border-top:1px solid var(--border);color:var(--text-faint)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-caption)}
.tabbar .on{color:var(--accent);font-weight:600}
.tabbar .on svg path.f{fill:currentColor}
/* 접힌 시그널 카드 */
.scard{background:var(--panel);border-top:1px solid var(--border);padding:12px 16px}
.scard .l1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.scard .l1 b{font-size:15px;font-weight:600}
.scard .l1 .px{font-size:var(--fs-body);font-weight:600}
.scard .why{font-size:var(--fs-sub);color:var(--text-dim);margin-top:4px}
.scard .t2{font-size:var(--fs-caption);color:var(--text-faint);margin-top:2px}
.scard .bd{margin-top:6px}
.scard .bd .badge{margin:0 6px 0 0}
.hgt{font-size:11px;font-weight:600;color:var(--on-amber);background:var(--amber);border-radius:4px;padding:1px 6px;margin-left:6px}
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search)
if (q.get('theme') === 'light') document.documentElement.dataset.theme = 'light'
if (q.get('rise') === 'red') document.documentElement.dataset.rise = 'red'

/* 앱 아이콘(iconPaths.ts)에서 가져온 그림 — [d, 켜지면 채움] */
const P = {
  home: [['M3.8 11.2 10.7 5a2 2 0 0 1 2.6 0l6.9 6.2V19a1.5 1.5 0 0 1-1.5 1.5H5.3A1.5 1.5 0 0 1 3.8 19z', 1], ['M12 14.5v3']],
  stocks: [['M7 3.5v3M7 15.5v4M17 4.5v4M17 15.5v4'], ['M5 6.5h4v9H5z', 1], ['M15 8.5h4v7h-4z', 1]],
  rebalance: [['M20.5 12A8.5 8.5 0 1 1 12 3.5M17 12a5 5 0 1 1-5-5'], ['M12 3.5A8.5 8.5 0 0 1 20.5 12H17a5 5 0 0 0-5-5z', 1]],
  macro: [['M3.5 16.5a8.5 8.5 0 1 1 17 0z', 1], ['M12 16.5l3.5-5'], ['M3.5 16.5h17']],
  settings: [['M18.66 9.84L20.55 10.37Q21.60 12.00 20.55 13.63L18.66 14.16L17.20 16.68L17.68 18.59Q16.80 20.31 14.86 20.22L13.46 18.85L10.54 18.85L9.14 20.22Q7.20 20.31 6.32 18.59L6.80 16.68L5.34 14.16L3.45 13.63Q2.40 12.00 3.45 10.37L5.34 9.84L6.80 7.32L6.32 5.41Q7.20 3.69 9.14 3.78L10.54 5.15L13.46 5.15L14.86 3.78Q16.80 3.69 17.68 5.41L17.20 7.32Z'], ['M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z']],
  search: [['M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13z'], ['M16 16l4 4']],
  back: [['M15 5l-7 7 7 7']], fwd: [['M9 5l7 7-7 7']], add: [['M12 5v14M5 12h14']],
  more: [['M4.5 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M11 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0M17.5 12a1 1 0 1 0 2 0 1 1 0 1 0-2 0']],
  grip: [['M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01']],
  edit: [['M4 20h4L19 9l-4-4L4 16z'], ['M13.5 6.5l4 4']],
  ai: [['M12 3.5c.7 5 3.5 7.8 8.5 8.5-5 .7-7.8 3.5-8.5 8.5-.7-5-3.5-7.8-8.5-8.5 5-.7 7.8-3.5 8.5-8.5z']],
  doc: [['M5.5 3.5h13v17h-13z'], ['M9 8.5h6M9 12h6M9 15.5h3.5']],
  sort: [['M7 4.5v15M4 16.5l3 3 3-3M17 19.5v-15M14 7.5l3-3 3 3']],
  refresh: [['M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4']],
  chev: [['M6 9l6 6 6-6']],
}
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${P[n].map(([d, f]) => `<path d="${d}"${f ? ' class="f"' : ''}/>`).join('')}</svg>`
const status = () => `<div class="status"><span class="num">8:12</span><span>●●● ▮</span></div>`
const topBar = () => `<div class="top"><b>자산관리</b><span class="fresh">방금 받음</span><span class="ic">${ic('refresh')}</span></div>`
const TABS = [['home', '홈'], ['stocks', '종목'], ['rebalance', '리밸런싱'], ['macro', '매크로'], ['settings', '설정']]
const tabbar = (on = 1) => `<nav class="tabbar">${TABS.map(([k, n], i) => `<a class="${i === on ? 'on' : ''}">${ic(k)}${n}</a>`).join('')}</nav>`
const sh = { buy: '<i class="shape tri-up"></i>', sell: '<i class="shape tri-dn"></i>', wt: '<i class="shape dia"></i>' }
const badge = (k) => k === 'buy' ? `<span class="badge b-buy">${sh.buy}매수</span>` : k === 'sell' ? `<span class="badge b-sell">${sh.sell}매도</span>` : k === 'over' ? `<span class="badge b-wt">${sh.wt}비중 초과</span>` : k === 'under' ? `<span class="badge b-wt">${sh.wt}비중 미달</span>` : ''

/* 가짜 종목 — 이름, 티커·시장, 현재가, 등락 %, 신호 */
const S = [
  ['VOO', 'VOO · 미국', '$98.35', +0.82, 'buy'],
  ['QQQ', 'QQQ · 미국', '$512.40', +1.24, ''],
  ['SCHD', 'SCHD · 미국', '$27.91', -0.18, 'under'],
  ['AAPL', 'AAPL · 미국', '$231.06', -1.02, 'sell'],
  ['NVDA', 'NVDA · 미국', '$141.27', +3.41, 'over'],
  ['삼성전자', '005930 · 한국', '₩58,900', -0.84, 'buy'],
  ['TIGER 미국필라델피아반도체나스닥', '381180 · 한국', '₩21,435', +2.06, ''],
  ['SK하이닉스', '000660 · 한국', '₩198,300', +1.53, 'sell'],
  ['トヨタ自動車', '7203 · 일본', '¥2,684', -0.37, ''],
  ['東京海上ホールディングス', '8766 · 일본', '¥5,512', +0.29, ''],
]
const pct = (v) => `<span class="${v >= 0 ? 'up' : 'dn'} num">${v >= 0 ? '+' : ''}${v.toFixed(2)}%</span>`

/* 작은 차트 선 — 같은 씨앗이면 같은 모양 */
function walk(seed, n, drift) { let x = 50, out = []; let r = seed; for (let i = 0; i < n; i++) { r = (r * 9301 + 49297) % 233280; x += (r / 233280 - .5) * 9 + drift; out.push(x) } return out }
function spark(seed, drift) {
  const v = walk(seed, 40, drift), lo = Math.min(...v), hi = Math.max(...v)
  const pts = v.map((y, i) => `${(i / 39 * 100).toFixed(1)},${(28 - (y - lo) / (hi - lo || 1) * 26).toFixed(1)}`).join(' ')
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${drift >= 0 ? 'var(--up)' : 'var(--down)'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`
}
function bigChart(h = 250) {
  const v = walk(7, 120, .25), lo = Math.min(...v), hi = Math.max(...v), W = 340
  const y = (u) => (h - 26) - (u - lo) / (hi - lo) * (h - 40)
  const pts = v.map((u, i) => `${(i / 119 * (W - 44)).toFixed(1)},${y(u).toFixed(1)}`).join(' ')
  const mk = [[14, 'buy'], [33, 'buy'], [48, 'sell'], [61, 'buy'], [79, 'sell'], [97, 'sell'], [117, 'buy']].map(([i, k]) => {
    const cx = i / 119 * (W - 44), cy = y(v[i])
    return k === 'buy' ? `<path d="M${cx - 4},${cy + 14} L${cx + 4},${cy + 14} L${cx},${cy + 7}z" fill="var(--signal-buy)"/>` : `<path d="M${cx - 4},${cy - 14} L${cx + 4},${cy - 14} L${cx},${cy - 7}z" fill="var(--signal-sell)"/>`
  }).join('')
  const grid = [0, 1, 2, 3].map((k) => { const gy = 14 + k * (h - 40) / 3; return `<line x1="0" x2="${W - 44}" y1="${gy}" y2="${gy}" stroke="var(--chart-grid)"/><text x="${W - 2}" y="${gy + 4}" text-anchor="end" font-size="11" fill="var(--chart-text)">${(hi - k * (hi - lo) / 3 + 40).toFixed(0)}</text>` }).join('')
  return `<svg viewBox="0 0 ${W} ${h}" height="${h}">${grid}<polyline points="${pts}" fill="none" stroke="var(--chart-line)" stroke-width="1.6"/>${mk}
    <text x="4" y="${h - 6}" font-size="11" fill="var(--chart-text)">2026</text><text x="120" y="${h - 6}" font-size="11" fill="var(--chart-text)">5월</text><text x="230" y="${h - 6}" font-size="11" fill="var(--chart-text)">9월</text></svg>`
}
