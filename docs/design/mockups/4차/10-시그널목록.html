.dark .pcwrap{--bg:#0a0f18;--surf:#0d1627;--text:#e6ebf2;--dim:#c3cad5;--faint:#909aab;--line:#1d2a40;--buy:#3ccf71;--sell:#f47171;--wt:#92b1db;--up:#3ccf71;--down:#f47171;--link:#92b1db}

.kpi5>div{padding:16px 20px;border-left:1px solid var(--line)}
.kpi5>div:first-child{border-left:0}
.kpi5 .k{font-size:13px;color:var(--faint);display:flex;justify-content:space-between}
.kpi5 .k u{color:var(--link);font-size:12px;text-underline-offset:3px}
.kpi5 .v{font-family:'Spoqa Han Sans Neo',sans-serif;font-weight:700;font-size:21px;margin-top:6px}
.kpi5 .v.huge{font-size:32px;letter-spacing:-.02em}
.kpi5 .s{font-size:12px;color:var(--faint);margin-top:4px}
.kpi5 .s a{color:var(--link);text-decoration:underline}
.pchead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pchead h2{font-size:20px}
.pchead .chips{padding:0;margin-left:12px}
.mtable{background:var(--surf);border:1px solid var(--line);border-radius:12px;height:120px;display:grid;place-items:center;color:var(--faint);font-size:13px}
.lbl{font-size:12px;color:#fff;opacity:.9;margin:4px 0 8px}
</style>
</head>
<body>
<script>
if (new URLSearchParams(location.search).get('theme') !== 'light') document.documentElement.classList.add('dark')
const I = {
  r: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  m: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
}
const TABS = [['대시보드','<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'],['재무','<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>'],['리밸런싱','<path d="M12 4v16M5 20h14M6 8h12M6 8l-3 6h6zM18 8l-3 6h6z"/>'],['매크로','<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'],['더보기','<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>']]
const tabbar = (on = 0) => `<nav class="tabbar">${TABS.map(([n, d], i) => `<a class="${i === on ? 'on' : ''}"><svg viewBox="0 0 24 24">${d}</svg>${n}</a>`).join('')}</nav>`
const status = () => `<div class="status"><span class="num">8:12</span><span>●●● ▮</span></div>`
const topBar = (right = `<span class="fresh">방금 받음</span><span class="ic">${I.r}</span><span class="ic">${I.m}</span>`) => `<div class="top"><b>자산관리</b>${right}</div>`
const sum = (macroIn) => `<div class="sum">
  <div class="stack"><div class="head"><span class="k">총 평가금액</span><span class="hide">금액 가리기</span></div><span class="v num huge">₩525,114,227</span></div>
  <div><div class="k">평가손익</div><div class="v num" style="color:var(--up)">+₩58,154,466</div></div>
  <div><div class="k">수익률</div><div class="v num" style="color:var(--up)">+12.5%</div></div>
  <div><div class="k">최근 거래일 대비</div><div class="v num" style="color:var(--up)">+₩2,733,187</div></div>
  <div class="rv"><div class="k">다음 리뷰 · 분기</div><a class="v num">55일 뒤<small>리밸런싱</small></a></div>
</div><div class="note">현금 ₩0 · 현금 포함 · 원화 기준</div>${macroIn ? macro() : ''}`
const macro = () => `<div class="macro"><span>VIX<b class="num">21.0</b></span><span>장단기 금리차<b class="num">0.36%</b></span></div>`
const sig = () => `<div class="sig"><div><b class="num" style="color:var(--buy)">3</b><i class="shape up" style="color:var(--buy)"></i>매수</div><div><b class="num" style="color:var(--sell)">4</b><i class="shape dn" style="color:var(--sell)"></i>매도</div><div><b class="num" style="color:var(--wt)">5</b><i class="shape dia" style="color:var(--wt)"></i>비중조절</div></div>`
const tools = () => `<div class="tools"><span class="sel">평가금액순 ▾</span><span class="sel">종목별 통화 ▾</span><span class="sp"></span><span class="btn">✎ 수정</span></div>`
const H = [
  ['TIGER 미국필라델피아반도체나스닥', '2,000주', '₩38,420,000', '+11.6%', 'up', '7.3%', '₩19,210', '+1.2%', ['buy'], '+₩3,993,103'],
  ['VOO', '40주', '₩30,120,551', '+21.9%', 'up', '5.7%', '$542.11', '+0.4%', [], '+₩5,411,612'],
  ['삼성전자', '1,500주', '₩83,250,000', '−7.4%', 'down', '15.9%', '₩55,500', '−0.9%', ['buy'], '−₩6,652,700'],
  ['NVDA', '45주', '₩8,962,310', '+66.7%', 'up', '1.7%', '$143.20', '+2.8%', ['buy', 'wt'], '+₩3,585,820'],
  ['トヨタ自動車', '300주', '₩7,812,004', '−9.1%', 'down', '1.5%', '¥2,612', '−0.3%', ['wt'], '−₩782,140'],
]
const sigCell = s => s.length ? s.map(k => k === 'buy' ? `<span class="badge" style="color:var(--buy)"><i class="shape up"></i>매수</span>` : `<span class="badge wt" style="color:var(--wt)"><i class="shape dia"></i>비중 초과</span>`).join(' ') : ''
const table = (full) => `<table style="table-layout:fixed"><colgroup><col><col style="width:33%"><col style="width:28%"></colgroup><tr><th>종목 · 수량 · 신호</th><th>평가금액</th><th>수익률</th></tr>
  ${H.map(h => `<tr><td><b>${h[0]}</b><small class="num">${h[1]} · 비중 ${h[5]}</small>${h[8].length ? `<div class="sigs">${sigCell(h[8])}</div>` : ''}</td><td class="num">${h[2]}${full ? `<small class="num">${h[6]} <span style="color:var(--${h[7].startsWith('+') ? 'up' : 'down'})">${h[7]}</span></small>` : ''}</td><td class="num" style="color:var(--${h[4]})">${h[3]}<small class="num" style="color:var(--${h[4]})">${h[9]}</small></td></tr>`).join('')}
</table><div class="legend">▲ 매수 · ▼ 매도(참고) · ◆ 비중조절 — 시그널은 참고용이며 투자 권유가 아닙니다.</div>`




const gear = (() => { let d = ''; for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2, w = Math.PI / 6, p = (r, g) => `${(12 + r * Math.cos(g)).toFixed(2)} ${(12 + r * Math.sin(g)).toFixed(2)}`; d += (i ? 'L' : 'M') + p(7, a - w * 0.6) + `L${p(8.7, a - w * 0.36)}Q${p(9.6, a)} ${p(8.7, a + w * 0.36)}L${p(7, a + w * 0.6)}` } return d + 'Z' })()
const IC = {
  홈: [['M3.8 11.2 10.7 5a2 2 0 0 1 2.6 0l6.9 6.2V19a1.5 1.5 0 0 1-1.5 1.5H5.3A1.5 1.5 0 0 1 3.8 19z', 1], ['M12 14.5v3', 0, 1]],
  종목: [['M7 3.5v3M7 15.5v4M17 4.5v4M17 15.5v4', 0], ['M5 6.5h4v9H5z', 1], ['M15 8.5h4v7h-4z', 1]],
  리밸런싱: [['M20.5 12A8.5 8.5 0 1 1 12 3.5M17 12a5 5 0 1 1-5-5', 0], ['M12 3.5A8.5 8.5 0 0 1 20.5 12H17a5 5 0 0 0-5-5z', 1]],
  매크로: [['M3.5 16.5a8.5 8.5 0 1 1 17 0z', 1], ['M12 16.5l3.5-5', 0, 1], ['M3.5 16.5h17', 0]],
  설정: [[gear, 1], ['M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', 0, 1]],
  뒤로: [['M15 5l-7 7 7 7', 0]],
  AI: [['M12 3.5c.7 5 3.5 7.8 8.5 8.5-5 .7-7.8 3.5-8.5 8.5-.7-5-3.5-7.8-8.5-8.5 5-.7 7.8-3.5 8.5-8.5z', 1]],
  새로고침: [['M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4', 0]],
}
const ico = (n, on = false, size = 24) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${IC[n].map(([d, c, k]) => on ? (c ? `<path d="${d}" fill="currentColor"/>` : `<path d="${d}"${k ? ' stroke="var(--surf)"' : ''}/>`) : `<path d="${d}"/>`).join('')}</svg>`
const TAB5 = ['홈', '종목', '리밸런싱', '매크로', '설정']
const nav = (on) => `<nav class="tabbar2">${TAB5.map((n, i) => `<a class="${i === on ? 'on' : ''}"><span class="ico">${ico(n, i === on)}</span>${n}</a>`).join('')}</nav>`

const ico2 = (n, size = 18) => ico(n, false, size)
const B = { buy: '<span class="badge" style="color:var(--buy)"><i class="shape up"></i>매수</span>', sell: '<span class="badge" style="color:var(--sell)"><i class="shape dn"></i>매도</span>', wt: '<span class="badge wt" style="color:var(--wt)"><i class="shape dia"></i>비중 초과</span>' }
const S = [
  ['NVDA', 'buy', '매수 조건 4/4 — 이격도 −10.1% · ADX 67', '$696.62', '−1.11%', 'down'],
  ['삼성전자', 'buy', '매수 조건 4/4 — 이격도 −2.8% · ADX 35', '₩45,208', '−1.70%', 'down'],
  ['AAPL', 'sell', '과열 — 이격도 +12.4% · 200일선 +31%', '$1,413.98', '+1.28%', 'up'],
  ['TIGER 미국필라델피아반도체나스닥', 'wt', '목표 6% → 지금 34.9% (+28.9%p)', '₩90,971', '−0.04%', 'down'],
  ['KODEX 200', 'sell', '과열 — 이격도 +9.1%', '₩28,794', '+0.51%', 'up'],
  ['QQQ', 'wt', '목표 10% → 지금 4.9% (−5.1%p)', '$738.26', '−2.02%', 'down'],
]
const head = () => `${status()}${topBar(`<span class="fresh">방금 받음</span><span class="ic">${ico('새로고침', false, 22)}</span>`)}<div class="back"><span style="display:grid;place-items:center">${ico('뒤로', false, 22)}</span>시그널 <span style="color:var(--faint);font-weight:600;margin-left:4px">11종목</span></div>
  <div class="chips"><span class="on">전체 11</span><span>▲ 매수 3</span><span>▼ 매도 5</span><span>◆ 비중 5</span><span class="sel">구분: 전체 ▾</span></div>
  <div class="aimini">${ico2('AI')}AI 종목 정리 ›</div>`
const card = (x, open) => `<div class="sc"><div class="t"><b>${x[0]}</b>${B[x[1]]}<span class="px num">${x[3]}<small style="color:var(--${x[5]})">${x[4]}</small></span></div><div class="why">${x[2]}</div>
  ${open ? `<div class="open"><div class="conds"><span>✓ 이격도 &lt; 0</span><span>✓ ADX &gt; 20</span><span>✓ DI 약세</span><span>✓ 변동성·거래량</span></div>
  <div class="kv2"><span>이격도 (MA20)</span><span style="color:var(--down)">−10.09%</span><span>ADX 추세강도</span><span>67.0</span><span>DI (+/−)</span><span>4.3 / 62.1</span><span>거래량비</span><span>1.45x</span><span>마지막 매수 신호</span><span>2026-11-06 · 오늘</span></div>
  <div class="btns"><span>차트</span><span>AI 분석</span></div></div>` : ''}</div>`
const A = `<div class="phone">${head()}${card(S[0], true)}${S.slice(1, 4).map(x => card(x)).join('')}${nav(0)}</div>`
const row = (x) => `<div class="rowl"><b>${x[0]}</b><span class="r num">${x[3]}</span><span class="why">${B[x[1]]}${x[2]}</span></div>`
const Bv = `<div class="phone">${head()}${S.map(row).join('')}${nav(0)}</div>`
const pc = `<div class="pcwrap">
  <div class="kpi5"><div><div class="k">총 평가금액 <u>금액 가리기</u></div><div class="v huge num">₩520,991,193</div><div class="s">현금 ₩0 포함 · 원 기준</div></div>
  <div><div class="k">평가손익</div><div class="v num" style="color:var(--up)">+₩57,896,433</div></div>
  <div><div class="k">수익률</div><div class="v num" style="color:var(--up)">+12.5%</div></div>
  <div><div class="k">최근 거래일 대비</div><div class="v num" style="color:var(--down)">−₩2,196,093</div><div class="s num" style="color:var(--down)">−0.42%</div></div>
  <div><div class="k">다음 리뷰 · 분기</div><div class="v num">D-54</div><div class="s">2026-12-30 · <a>리밸런싱</a></div></div></div>
  <div class="pchead"><h2>시그널 <span style="color:var(--faint);font-size:15px">11종목</span></h2><div class="chips"><span class="on">전체 11</span><span>▲ 매수 3</span><span>▼ 매도 5</span><span>◆ 비중 5</span><span>구분: 전체 ▾</span></div><span style="margin-left:auto;font-size:13px;color:var(--link);font-weight:600">AI 종목 정리 ›</span></div>
  <div class="mtable">지금 시그널 표 그대로 (종목 · 신호 · 지표 칸마다 ✓)</div></div>`
document.body.innerHTML = `
  <div class="col"><div class="cap">가 · 접힌 카드 <span class="pick">추천</span><small>칩 한 줄 · 카드는 한 줄 이유 · 누르면 지표(맨 위가 펼친 모습)</small></div>${A}</div>
  <div class="col"><div class="cap">나 · 줄 목록<small>더 많이 보임 · 누르면 같은 펼침</small></div>${Bv}</div>
  <div class="col wide"><div><div class="cap">PC — 요약 다섯 칸(위, 홈) · 시그널 목록 위쪽은 칩 한 줄, 표는 그대로</div>${pc}</div></div>`
</script>
</body>
</html>
