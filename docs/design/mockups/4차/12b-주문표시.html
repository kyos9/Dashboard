<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4차 리밸런싱 주문 표시</title>
<!--
  디자인 4차 목업 12b — 리밸런싱 줄의 주문 표시. 주인: "사기 팔기를 글씨로 쓰니까 별로다".
  (아래 설명은 12 그대로)
  지금(앱, 가짜 서버 15종목): 폰 한 화면 길이 9,482px. 주문 카드 15장(카드마다 비중 줄 · 금액 줄 · 신호 · "거래 입력")
  → 보유 · 목표 비중 고치는 카드 15장(칸 5개씩) → 리뷰 · 기록 → 접힌 설정. PC 는 표 1120px 이 본문보다 넓어 신호 열이 잘림.

  가 · 할 일 줄    한 종목 한 줄(팔기 먼저, 그다음 사기 · 유지는 접음). 줄을 누르면 시트에서 자세히 · 거래 입력.
                   보유 · 목표 고치기 · 기록 · 설정은 아래 줄 셋으로 — 누르면 시트/화면
  나 · 비중 막대    줄마다 지금 비중 막대 + 목표 눈금 + 밴드. "어디가 얼마나 벗어났나"가 먼저, 금액은 오른쪽
  다 · 위 탭 셋     주문 · 비중 · 기록 을 탭으로 나눠 한 번에 하나만. 비중 탭에서 목표를 바로 고침
  공통              줄 누르면 시트(자세히 + 거래 입력) · 목표 비중 한 번에 고치기 시트 · PC 표 6열

  색·글꼴은 앱의 frontend/src/styles/tokens.css 를 그대로 불러 그린다(만드는 법 3). 데이터는 가짜.
  사기 · 팔기는 시그널 색(--signal-buy · --signal-sell)을 쓴다 — 상승 빨강이면 사기도 빨강(묶음 1에서 넘어온 것).
  ?theme=light 로 라이트, ?rise=red 로 상승 빨강.
-->
<link rel="stylesheet" href="../../../../frontend/src/styles/tokens.css">
<style>

.mini{font-size:var(--fs-caption);color:var(--text-faint)}
</style>

  edit: [['M4 20h4L19 9l-4-4L4 16z'], ['M13.5 6.5l4 4']],
  doc: [['M5.5 3.5h13v17h-13z'], ['M9 8.5h6M9 12h6M9 15.5h3.5']],
  refresh: [['M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4']],
  chev: [['M6 9l6 6 6-6']],
}
const ic = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${P[n].map(([d, f]) => `<path d="${d}"${f ? ' class="f"' : ''}/>`).join('')}</svg>`
const status = () => `<div class="status"><span class="num">8:12</span><span>●●● ▮</span></div>`
const topBar = () => `<div class="top"><b>자산관리</b><span class="fresh">방금 받음</span><span class="ic">${ic('refresh')}</span></div>`
const TABS = [['home', '홈'], ['stocks', '종목'], ['rebalance', '리밸런싱'], ['macro', '매크로'], ['settings', '설정']]
const tabbar = (on = 2) => `<nav class="tabbar">${TABS.map(([k, n], i) => `<a class="${i === on ? 'on' : ''}">${ic(k)}${n}</a>`).join('')}</nav>`
const sh = { buy: '<i class="shape tri-up"></i>', sell: '<i class="shape tri-dn"></i>', wt: '<i class="shape dia"></i>' }
const sig = (k) => k === 'over' ? `<span class="badge b-wt">${sh.wt}비중 초과</span>` : k === 'under' ? `<span class="badge b-wt">${sh.wt}비중 미달</span>` : k === 'ref' ? `<span class="badge b-plain">${sh.sell}기간 내 매도</span>` : ''
const won = (v) => (v < 0 ? '−' : '+') + '₩' + Math.abs(v).toLocaleString('en-US')
const short = (v) => { const a = Math.abs(v); return (v < 0 ? '−' : '+') + (a >= 1e8 ? (a / 1e8).toFixed(2) + '억' : Math.round(a / 1e4).toLocaleString('en-US') + '만') }

/* 가짜 주문 — 이름, 구분, 지금 %, 목표 %, 조정 금액(원), 주수, 신호들, 현지 금액 */
const O = [
  ['TIGER 미국필라델피아반도체나스닥', '테마', 33.2, 6, -138800237, -1638, ['over']],
  ['삼성전자우', '배당', 12.6, 4, -43811225, -409, ['over', 'ref']],
  ['AAPL', '알파', 11.5, 5, -33295634, -16, ['over', 'ref'], '−$24,036'],
  ['삼성전자', '알파', 13.4, 10, -17201562, -378, []],
  ['NVDA', '알파', 8.9, 6, -14790400, -14, [], '−$10,677'],
  ['TSLA', '알파', 1.7, 0, -8711800, -60, [], '−$6,289'],
  ['VOO', '지수', 1.1, 18, 86337312, 621, ['under', 'ref'], '+$62,328'],
  ['QQQ', '지수', 5.0, 10, 25548982, 25, ['under'], '+$18,444'],
  ['SCHD', '지수', 1.4, 6, 23412654, 389, ['ref'], '+$16,902'],
  ['MSFT', '알파', 0.6, 5, 22468446, 88, ['ref'], '+$16,220'],
  ['GOOG', '알파', 0.8, 4, 16359769, 80, ['ref'], '+$11,810'],
  ['トヨタ自動車', '배당', 2.2, 4, 9020149, 237, ['ref'], '+¥968,867'],
  ['KODEX 200', '지수', 5.8, 6, 0, 0, []],
  ['SK하이닉스', '알파', 3.8, 4, 0, 0, []],
  ['東京海上ホールディングス', '배당', 1.9, 2, 0, 0, []],
]
const sells = O.filter((o) => o[4] < 0), buys = O.filter((o) => o[4] > 0), holds = O.filter((o) => o[4] === 0)
const act = (o) => o[4] < 0 ? `<b class="sell num">팔기 ${Math.abs(o[5]).toLocaleString('en-US')}주</b>` : o[4] > 0 ? `<b class="buy num">사기 ${o[5].toLocaleString('en-US')}주</b>` : `<b class="faint">유지</b>`

const col = (cap, sub, body) => `<div class="col"><div class="cap">${cap}<small>${sub}</small></div>${body}</div>`
const phone = (inner, cls = '') => `<div class="phone ${cls}">${inner}</div>`
const head = () => `<div class="h1"><b>리밸런싱</b><span class="pill">다음 리뷰 <em class="num">D-48</em></span><span class="more-btn">${ic('more')}</span></div>`
const sum = () => `<div class="sum"><div class="l1"><span>전체 자금 · 현금 포함</span><b class="num">₩510,529,378</b></div>
  <div class="l2"><span>현금 <b class="num">₩0</b></span><span>목표 현금 <b class="num">0%</b></span><span>밴드 <b class="num">±3%p</b></span></div></div>`
const warn = () => `<div class="warn">⚠ 목표 합계 <b class="num">90%</b> — 100%가 아님<span class="go">고치기 ›</span></div>`
const money = () => `<div class="money"><div class="r"><span class="lab">새로 넣을 돈 <small class="faint">(선택)</small></span><span class="inp ph">0 <u>원</u></span></div>
  <div class="chk"><i></i>팔지 않고 새 돈만 나누기</div></div>`

/* ---------- 가 · 할 일 줄 ---------- */
const ordRow = (o) => `<div class="ord"><div class="nm"><b>${o[0]}</b><small><span class="num">${o[2].toFixed(1)}% → 목표 ${o[3]}%</span>${o[6].map(sig).join('')}</small></div>
  <div class="act">${act(o)}<small class="num">${o[4] ? won(o[4]) : '—'}</small></div><span class="go">›</span></div>`
const gaBody = (all) => `${head()}${sum()}${warn()}${money()}
  <div class="chips"><span class="chip on">할 일 ${sells.length + buys.length}</span><span class="chip">비중 신호 3</span><span class="sp"></span><small>팔기 먼저</small></div>
  <div class="sec"><span>팔기 ${sells.length}</span><em class="num">${short(sells.reduce((s, o) => s + o[4], 0))}</em></div>
  <div class="list">${sells.map(ordRow).join('')}</div>
  <div class="sec"><span>사기 ${buys.length}</span><em class="num">${short(buys.reduce((s, o) => s + o[4], 0))}</em></div>
  <div class="list">${(all ? buys : buys.slice(0, 3)).map(ordRow).join('')}</div>
  ${all ? `<div class="sec"><span>유지 ${holds.length}</span><em>조정이 전체의 0.5% 미만</em></div>
  <div class="fold">${holds.map((o) => o[0]).join(' · ')}<span class="go">${ic('chev', 'i s')}</span></div>
  <div class="links">
    <div class="lk"><span class="lead">${ic('edit')}</span><div>보유 · 목표 비중 고치기<small>수량 · 평단가 · 목표 · 밴드 — 한 번에</small></div><span class="go">›</span></div>
    <div class="lk"><span class="lead">${ic('doc')}</span><div>리뷰 · 기록<small>지금 상태 기록하기 · 지난 기록 0건</small></div><span class="go">›</span></div>
    <div class="lk"><span class="lead">${ic('settings')}</span><div>리밸런싱 설정<small>리뷰 주기 · 현금 · 기준통화 · 환율 · 밴드</small></div><span class="go">›</span></div>
  </div>
  <p class="hint" style="margin:12px 16px 0">주문은 지금 가격으로 목표에 맞추는 참고입니다. 실제로 사고파는 것은 리뷰 때 정합니다.</p>` : ''}`
const out = []
const col2 = (cap, sub, rowFn, secName) => col(cap, sub, phone(`${status()}${topBar()}<div class="scroll">${head()}
  <div class="chips"><span class="chip on">할 일 ${sells.length + buys.length}</span><span class="chip">비중 신호 3</span></div>
  <div class="sec"><span>${secName[0]}</span><em class="num">${short(sells.reduce((s, o) => s + o[4], 0))}</em></div>
  <div class="list">${sells.slice(0, 5).map(rowFn).join('')}</div>
  <div class="sec"><span>${secName[1]}</span><em class="num">${short(buys.reduce((s, o) => s + o[4], 0))}</em></div>
  <div class="list">${buys.slice(0, 4).map(rowFn).join('')}</div></div>${tabbar()}`))
const nmPart = (o) => `<div class="nm"><b>${o[0]}</b><small><span class="num">${o[2].toFixed(1)}% → 목표 ${o[3]}%</span>${o[6].filter((k) => k !== 'ref').map(sig).join('')}</small></div>`
const n = (v) => Math.abs(v).toLocaleString('en-US')
const tone = (o) => (o[4] < 0 ? 'sell' : 'buy')

/* 1 · 부호 숫자 — 머리에만 한 번 "줄일 것 / 늘릴 것" */
out.push(col2('1 · 부호 숫자', '줄마다 글씨 없이 −1,638주 / +621주 (색 + 부호). 묶음 머리에만 한 번', (o) => `<div class="ord">${nmPart(o)}
  <div class="act"><b class="${tone(o)} num">${o[4] < 0 ? '−' : '+'}${n(o[5])}주</b><small class="num">${won(o[4])}</small></div><span class="go">›</span></div>`, ['줄일 종목', '늘릴 종목']))

/* 2 · 모양 — 시그널 배지와 같은 ▲▼ */
out.push(col2('2 · ▲▼ 모양', '홈 시그널과 같은 모양 — ▲ 늘림(사기) · ▼ 줄임(팔기). 색 + 모양이라 색약에도', (o) => `<div class="ord">${nmPart(o)}
  <div class="act"><b class="${tone(o)} num">${o[4] < 0 ? sh.sell : sh.buy}${n(o[5])}주</b><small class="num">${won(o[4])}</small></div><span class="go">›</span></div>`, ['▼ 줄일 종목', '▲ 늘릴 종목']))

/* 3 · 왼쪽 색 띠 */
out.push(col2('3 · 왼쪽 색 띠', '줄 왼쪽 띠 색으로 구분 · 오른쪽은 주수 · 금액만', (o) => `<div class="ord stripe" style="--c:var(--signal-${tone(o)})">${nmPart(o)}
  <div class="act"><b class="num">${n(o[5])}주</b><small class="num ${tone(o)}">${won(o[4])}</small></div><span class="go">›</span></div>`, ['팔 것', '살 것']))

/* 4 · 화살표 막대 — 지금 → 목표 */
const MX = 36
out.push(col2('4 · 지금 → 목표 화살표', '막대 위 점(지금)에서 목표까지 화살표 — 방향이 곧 사고팖. 숫자는 오른쪽', (o) => {
  const a = Math.min(o[2], MX) / MX * 100, b = o[3] / MX * 100, l = Math.min(a, b), w = Math.abs(a - b)
  return `<div class="ord" style="--c:var(--signal-${tone(o)})"><div class="nm"><b>${o[0]}</b>
  <div class="arr"><i class="seg" style="left:${l}%;width:${w}%"></i><i class="now" style="left:${a}%"></i><i class="to ${b > a ? 'r' : 'l'}" style="left:${b}%"></i></div>
  <span class="mini num">${o[2].toFixed(1)}% → ${o[3]}%</span></div>
  <div class="act"><b class="${tone(o)} num">${o[4] < 0 ? '−' : '+'}${n(o[5])}주</b><small class="num">${short(o[4])}</small></div><span class="go">›</span></div>`
}, ['줄일 종목', '늘릴 종목']))

document.body.innerHTML = out.join('')
</script>
</body>
</html>
