<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5차 폰 아래 탭</title>
<!--
  디자인 5차 목업 14: 폰 아래 탭 (주인: 아이콘 없애고 명칭만). 탭은 PC 메뉴와 같게 홈 · 재무 · 리밸런싱 · 매크로 · 설정.
  고른 탭 표시 셋: 가 위 선 / 나 알약 바탕 / 다 굵기와 색만. 390 · 360 두 폭.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#5f646b}
body{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;word-break:keep-all;padding:28px 20px;color:#fff}
.part{font-size:22px;font-weight:700;margin-bottom:6px}.part small{display:block;font-size:14px;font-weight:400;opacity:.9;margin-top:6px}
.row{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.cap{font-size:16px;font-weight:700;margin-bottom:8px}.cap small{font-size:12px;font-weight:400;opacity:.85;margin-left:6px}
.ph{background:#f4f6fa;color:#0f2440;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;height:300px}
.body{flex:1;padding:16px;font-size:13px;color:#4f6383}
.body b{display:block;color:#0f2440;font-size:16px;margin-bottom:6px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #dbe2ef;padding-bottom:14px}
.tabs span{position:relative;display:grid;place-items:center;height:54px;font-size:14px;font-weight:600;color:#4f6383}
.tabs i{font-style:normal}
.dot{position:absolute;top:12px;right:calc(50% - 20px);width:7px;height:7px;border-radius:50%;background:#b45309}
/* 가 */ .a span.on{color:#2b5c9c;font-weight:800;box-shadow:inset 0 3px 0 #2b5c9c}
/* 나 */ .b span.on{color:#2b5c9c;font-weight:800}.b span.on::before{content:'';position:absolute;inset:10px 6px;border-radius:99px;background:rgba(43,92,156,.1);z-index:0}.b span i{position:relative;font-style:normal}
/* 다 */ .c span.on{color:#0f2440;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div class="part">폰 아래 탭: 아이콘 없이 이름만<small>탭은 PC 위 메뉴와 같게 홈, 재무, 리밸런싱, 매크로, 설정. 고른 탭 표시만 다르다. 설정 점은 그대로.</small></div>
<div id="out"></div>
<script>
const T=['홈','재무','리밸런싱','매크로','설정']
const ph=(cls,w)=>`<div class="ph" style="width:${w}px"><div class="body"><b>홈</b>총액, AI 띠, 보유 · 관심 · 시그널 …</div><div class="tabs ${cls}">${T.map((t,i)=>`<span class="${i==0?'on':''}"><i>${t}</i>${i==4?'<em class="dot"></em>':''}</span>`).join('')}</div></div>`
const V=[['a','가 위 선','고른 탭 위에 강조색 선 (PC 위 메뉴의 밑줄과 같은 결)'],['b','나 알약 바탕','고른 탭 글자 뒤에 옅은 알약'],['c','다 굵기만','고른 탭만 진하고 크게, 다른 표시 없음']]
out.innerHTML=V.map(([c,t,s])=>`<div class="cap">${t}<small>${s}</small></div><div class="row" style="margin-top:0;margin-bottom:26px">${ph(c,390)}${ph(c,360)}</div>`).join('')
</script>
</body>
</html>
