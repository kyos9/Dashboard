<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5차 시그널 카드 셋</title>
<!--
  디자인 5차 목업 02d — 02c 에 주인 답 셋:
  (더: 카드 아래 "다 채우면 매수" 같은 글 뺌 · "기준" 단추는 글씨만 — 글씨와 아이콘을 같이 쓰지 않음)
  1 글 안에서 낱말 사이를 " · " 로 잇는 것(AI 티) → 쉼표 · 문장 · 줄 나눔으로. 화면 글 전체 규칙으로 status 에 적음
  2 오른쪽 매수 조건 · 매도 조건 · 비중 표의 크기가 다 다름 → 같은 크기 카드 셋을 나란히(줄 높이 같게)
  3 기준은 칸에서 뺌 → 시그널 탭 오른쪽 위 "기준" 단추로 따로 보는 창(앱에 있는 "시그널 기준" 창과 같은 자리)
  PC 1400 · 라이트 · 색과 글꼴은 앱 tokens.css · 데이터는 가짜.
-->
<link rel="stylesheet" href="../../../../frontend/src/styles/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#5f646b}
body{font-family:var(--font-sans);word-break:keep-all;padding:28px 20px 40px;color:#fff;font-size:14px}
.part{max-width:1400px;margin:0 auto 14px;font-size:22px;font-weight:700}
.part small{display:block;font-size:14px;font-weight:400;opacity:.9;margin-top:6px;line-height:1.55}
.cap{max-width:1400px;margin:30px auto 10px;font-size:17px;font-weight:700}
.cap small{font-size:13px;font-weight:400;opacity:.88;margin-left:8px}
.num{font-variant-numeric:tabular-nums}
.frame{width:1400px;margin:0 auto;background:var(--bg);color:var(--text);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.frame.short{padding-bottom:4px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shape{display:inline-block;width:.68em;height:.68em;margin-right:3px;background:currentColor}
.tri-up{clip-path:polygon(50% 0,100% 100%,0 100%)}.tri-dn{clip-path:polygon(0 0,100% 0,50% 100%)}.dia{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;white-space:nowrap;border-radius:6px;padding:2px 6px}
.b-buy{color:var(--signal-buy);background:var(--signal-buy-soft)}
.b-sell{color:var(--signal-sell);background:var(--signal-sell-soft)}
.b-wt{color:var(--signal-weight);background:var(--signal-weight-soft)}
.up{color:var(--up)}.down{color:var(--down)}.faint{color:var(--text-faint)}.dim{color:var(--text-dim)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:700;background:var(--panel-soft);color:var(--text-dim);margin-left:6px}

/* ── 메뉴 가: 위 한 줄 ── */
.nav1{height:60px;display:flex;align-items:center;gap:6px;padding:0 32px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;margin-right:28px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-style:normal;font-size:15px;font-weight:800}
.nav1 a{height:60px;display:inline-flex;align-items:center;padding:0 14px;font-size:15px;font-weight:600;color:var(--text-dim);border-bottom:3px solid transparent;margin-bottom:-1px}
.nav1 a.on{color:var(--accent);border-bottom-color:var(--accent)}
.nav1 a .cnt.sig{background:var(--signal-sell-soft);color:var(--signal-sell)}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.fresh{font-size:12px;color:var(--text-faint);display:inline-flex;align-items:center;gap:6px;margin-right:6px}
.fresh::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green)}
.icb{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--text-dim);border:1px solid var(--border)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-left:6px}
.who i{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-weight:700}

/* ── 메뉴 나: 위 두 줄 ── */
.bar2{height:56px;display:flex;align-items:center;padding:0 32px;background:var(--brand);color:var(--on-brand)}
.bar2 .logo i{background:var(--on-brand);color:var(--brand)}
.bar2 .fresh{color:var(--on-brand-dim)}
.bar2 .icb{color:var(--on-brand);border-color:var(--on-brand-line)}
.bar2 .who i{background:var(--on-brand-soft);color:var(--on-brand)}
.tabs2{height:50px;display:flex;align-items:flex-end;gap:4px;padding:0 32px;background:var(--panel);border-bottom:1px solid var(--border)}
.tabs2 a{height:50px;display:inline-flex;align-items:center;padding:0 16px;font-size:15px;font-weight:600;color:var(--text-dim);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs2 a.on{color:var(--text);border-bottom-color:var(--brand)}
.tabs2 a .cnt.sig{background:var(--signal-sell-soft);color:var(--signal-sell)}

/* ── 본문 ── */
.main{max-width:1240px;margin:0 auto;padding:28px 32px 36px}

/* 총액 A — 증권식 한 줄 */
.sumA{display:flex;align-items:flex-end;gap:40px;padding:26px 30px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.sumA .lab{font-size:13px;font-weight:600;color:var(--text-faint);display:flex;gap:12px;align-items:center}
.sumA .lab a{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.sumA .big{font-family:var(--font-summary-num);font-size:38px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.sumA .pl{font-family:var(--font-summary-num);font-size:18px;font-weight:700;margin-top:8px}
.sumA .pl small{font-size:13px;font-weight:500;color:var(--text-faint);margin-left:8px;font-family:var(--font-sans)}
.sumA .side{margin-left:auto;display:flex;gap:36px;padding-bottom:4px}
.sumA .side span{display:block;font-size:12px;color:var(--text-faint);margin-bottom:4px}
.sumA .side b{font-family:var(--font-summary-num);font-size:16px;font-weight:700}
.sumA .side a{font-size:12px;color:var(--accent);text-decoration:underline;margin-left:6px;font-weight:500}

/* 총액 B — 큰 총액 + 칸 없는 숫자 (바탕 위에 바로) */
.sumB{padding:6px 2px 22px;border-bottom:1px solid var(--border)}
.sumB .lab{font-size:14px;font-weight:600;color:var(--text-dim);display:flex;gap:12px;align-items:center}
.sumB .lab a{color:var(--accent);font-weight:500;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.sumB .big{font-family:var(--font-summary-num);font-size:44px;font-weight:700;letter-spacing:-.02em;margin:6px 0 14px;line-height:1.1}
.sumB .row{display:flex;gap:0}
.sumB .row div{padding-right:28px;margin-right:28px;border-right:1px solid var(--border)}
.sumB .row div:last-child{border-right:0}
.sumB .row span{font-size:12px;color:var(--text-faint);margin-right:8px}
.sumB .row b{font-family:var(--font-summary-num);font-size:17px;font-weight:700}

/* 총액 C — 카드 셋 */
.sumC{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}
.sumC > div{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px}
.sumC .lab{font-size:13px;font-weight:600;color:var(--text-faint);display:flex;justify-content:space-between}
.sumC .lab a{color:var(--accent);font-weight:500;text-decoration:underline}
.sumC .big{font-family:var(--font-summary-num);font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.sumC .mid{font-family:var(--font-summary-num);font-size:24px;font-weight:700;margin-top:8px}
.sumC small{display:block;font-size:13px;color:var(--text-faint);margin-top:6px}
.sumC small b{font-family:var(--font-summary-num);font-weight:700}

/* 보유 표 */
.sech{display:flex;align-items:center;gap:8px;margin:30px 0 12px}
.sech h2{font-size:18px;font-weight:700}
.sech h2 small{font-size:14px;color:var(--text-faint);font-weight:600;margin-left:4px}
.sech .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.sel{height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--panel);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.sel em{font-style:normal;color:var(--text-faint);font-weight:500}
.sqb{height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--panel);font-size:13px;font-weight:600}
.sqb.ai{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.vtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:28px 0 0;align-items:flex-end}
.vtabs a{padding:12px 18px;font-size:15px;font-weight:600;color:var(--text-dim);border-bottom:3px solid transparent;margin-bottom:-1px}
.vtabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.vtabs a .cnt.sig{background:var(--signal-sell-soft);color:var(--signal-sell)}
.vtabs{align-items:center}.vtabs .tools{margin-left:auto;display:flex;gap:8px;padding-bottom:8px}.vtabs + table{margin-top:14px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--text-faint);background:var(--panel-soft);padding:11px 12px;border-bottom:1px solid var(--border);text-align:center;line-height:1.4}
td{padding:13px 12px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;padding-left:20px}
td b{font-weight:700}
td .nm{font-weight:700;text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
td small{display:block;font-size:12px;color:var(--text-faint);margin-top:2px}
td .chg{display:block;font-size:12px;margin-top:2px}
td.w b{font-weight:700}
td.t{color:var(--text-dim)}
td .badge + .badge{margin-left:4px}
.legend{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--text-faint)}
.legend .buy{color:var(--signal-buy)}.legend .sell{color:var(--signal-sell)}.legend .wt{color:var(--signal-weight)}
.mark{outline:2px dashed var(--amber);outline-offset:3px;border-radius:6px}
.sqb.more{position:relative;width:38px;justify-content:center;padding:0;font-size:18px;letter-spacing:1px}
.pop{position:absolute;right:0;top:44px;width:max-content;min-width:112px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);padding:6px;z-index:2;font-size:14px;font-weight:500;color:var(--text);letter-spacing:0;text-align:left}
.pop div{padding:8px 12px;border-radius:6px}
.tip{position:absolute;right:0;top:46px;white-space:nowrap;background:var(--text);color:var(--panel);font-size:12px;font-weight:500;padding:6px 10px;border-radius:6px;z-index:3}
.ck{display:inline-block;width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;vertical-align:middle;background:var(--panel)}
.ck.on{background:var(--accent);border-color:var(--accent);position:relative}
.ck.on::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
tr.picked td{background:var(--accent-soft)}
.pickbar{align-items:center;gap:10px;padding-bottom:8px}
.txtb{color:var(--accent);font-size:13px;font-weight:600;cursor:pointer}
.sqb.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:.55}
.modal{position:absolute;left:50%;top:330px;transform:translateX(-50%);width:640px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow-modal);padding:22px 24px}
.modal .mh{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.modal .mh b{font-size:18px}
.modal .mh .x{margin-left:auto;color:var(--text-faint)}
.modal table.ed{border:0;border-radius:0}
.modal table.ed th{background:none;text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
.modal table.ed td{text-align:left;padding:10px 6px}
.modal table.ed th:first-child,.modal table.ed td:first-child{padding-left:0}
.inp{display:inline-flex;align-items:center;justify-content:flex-end;width:120px;height:38px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px;font-weight:600}
.inp em{font-style:normal;color:var(--text-faint);font-weight:500;margin-left:6px}
.del{color:var(--red)}
.modal .hint{font-size:12px;color:var(--text-faint);margin:12px 0 0;line-height:1.5}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
table.pk th:nth-child(2),table.pk td:nth-child(2){text-align:left}
.hd{display:inline-block;width:24px;margin-right:12px;color:var(--text-faint);font-size:20px;cursor:grab;vertical-align:middle;text-align:center}
tr.drag td{background:var(--panel-soft)}
table.pk td:first-child,table.pk th:first-child{white-space:nowrap;width:96px}
tr.drag{outline:2px solid var(--accent);outline-offset:-2px}
.tg{display:inline-flex;align-items:center;height:38px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--panel);padding:3px;gap:2px;font-size:13px;font-weight:600}

.tg span:not(.lb){height:30px;padding:0 12px;display:inline-flex;align-items:center;border-radius:6px;color:var(--text-dim)}
.tg span.on{background:var(--accent);color:var(--on-accent)}

.aiband{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 20px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius)}
.aiband .ico{width:36px;height:36px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--accent)}
.aiband b{display:block;color:var(--accent);font-size:15px}
.aiband small{display:block;font-size:12px;color:var(--text-dim);margin-top:2px}
.aiband .sqb{margin-left:auto}
.sqb.ai.top{margin-right:6px}
.sumA .side span{white-space:nowrap}
.sumA .side span.sqb{display:inline-flex;font-size:13px;color:var(--accent);margin:0;height:38px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.bcol{background:var(--panel-soft);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.bh{display:flex;align-items:center;font-size:15px;font-weight:700;padding:4px 4px 12px}
.bh.buy{color:var(--signal-buy)}.bh.sell{color:var(--signal-sell)}.bh.wt{color:var(--signal-weight)}
.bcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:8px}
.bcard:first-of-type{margin-top:0}
.bt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bt b{font-size:14px}.bt span{font-size:13px;font-weight:600;white-space:nowrap}
.why{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.5}
.bd{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--text-faint)}
.vtabs + .board,.vtabs + table,.vtabs + .md{margin-top:16px}
table.st th{padding:9px 8px}
table.st th.grp{border-bottom:1px solid var(--border)}
table.st th.grp.buy{color:var(--signal-buy)}table.st th.grp.sell{color:var(--signal-sell)}
table.st th.c{font-weight:500;font-size:11.5px}
table.st td{padding:11px 8px}
table.st td.c{width:62px}
table.st td.c.hit{background:var(--panel-soft)}
i.ok{font-style:normal;color:var(--signal-buy);font-weight:700}
i.no{font-style:normal;color:var(--text-faint)}
table.st td.c:nth-child(n+8) i.ok{color:var(--signal-sell)}
table.st td small,table.wt td small{display:block;font-size:12px;color:var(--text-faint);margin-top:2px}
.seg{display:inline-flex;background:var(--panel-soft);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg span{height:30px;padding:0 12px;display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--text-dim);border-radius:6px}
.seg span.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--border-strong)}
.md{display:grid;grid-template-columns:360px 1fr;gap:16px}
.mlist{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.mi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border)}
.mi:last-child{border-bottom:0}
.mi.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mi b{display:block;font-size:14px}.mi small{display:block;font-size:12px;margin-top:2px;color:var(--text-dim)}
.mb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mdet{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px}
.dh{display:flex;justify-content:space-between;align-items:flex-start}
.dh b{font-size:20px}.dh small{display:block;font-size:12px;color:var(--text-faint);margin-top:2px}
.dh .big{font-size:22px;font-weight:700;text-align:right}.dh .big small{font-size:13px;font-weight:600}
.dsig{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-size:13px;color:var(--text-dim)}
svg.chart{width:100%;height:150px;display:block;margin:6px 0 10px;background:var(--panel-soft);border-radius:8px}
.conds{border-top:1px solid var(--border)}
.cd{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border);font-size:14px}
.cd b{margin-left:auto;font-weight:600;color:var(--text-dim)}
.dfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px}
table.wt .dots{display:inline-flex;gap:4px;vertical-align:middle}
table.wt .dots i{width:9px;height:9px;border-radius:50%;background:var(--border-strong)}
table.wt .dots i.on{background:var(--signal-buy)}
table.wt td small{display:inline;margin-left:8px}
.sqb.ico{width:38px;padding:0;justify-content:center}
.grp{margin-top:16px}
.gh{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
.gh small{font-size:12px;font-weight:500;color:var(--text-faint)}
.gh b{margin-left:auto;font-size:14px}
.gh.buy{color:var(--signal-buy)}.gh.sell{color:var(--signal-sell)}.gh.wt{color:var(--signal-weight)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.grid4.g3{grid-template-columns:repeat(3,1fr)}
.gc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-left:1px solid var(--border);text-align:center}
.gc:first-child{border-left:0}
.gt{font-size:12px;color:var(--text-faint);font-weight:600}
.gm{font-size:18px;font-weight:700;color:var(--text-faint);line-height:1.2}
.gm.big{font-size:17px;color:var(--text)}
.gv{font-size:12px;color:var(--text-dim)}
.gc.ok-buy{background:var(--signal-buy-soft)}.gc.ok-buy .gm{color:var(--signal-buy)}
.gc.ok-sell{background:var(--signal-sell-soft)}.gc.ok-sell .gm{color:var(--signal-sell)}
.gc{justify-content:flex-start;height:112px;padding:12px 10px}
.gt{display:flex;align-items:center;gap:6px}
.gt .mk{font-style:normal;font-weight:800;font-size:13px}
.gc.ok-buy .gt .mk{color:var(--signal-buy)}.gc.ok-sell .gt .mk{color:var(--signal-sell)}
.gn{font-size:22px;font-weight:700;margin-top:6px;color:var(--text)}
.gc.ok-buy .gn{color:var(--signal-buy)}.gc.ok-sell .gn{color:var(--signal-sell)}
.gk{font-size:12px;color:var(--text-faint);margin-top:6px;line-height:1.4}
